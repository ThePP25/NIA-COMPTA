body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.muted{color:var(--muted)} .small{font-size:12.5px} .pos{color:var(--good)} .neg{color:var(--red)}
.n,td.n,th.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Bandes et barres */
.stripe{height:5px;flex:none;background:linear-gradient(90deg,var(--accent) 0 50%,var(--sun) 50% 80%,var(--red) 80%)}
.titlebar{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:14px;position:relative}
.titlebar::after{content:"";position:absolute;inset:0 0 0 auto;width:38%;opacity:.07;pointer-events:none;
  background:linear-gradient(135deg,transparent 45%,var(--ink) 45% 55%,transparent 55%) 0 0/18px 18px,linear-gradient(45deg,transparent 45%,var(--ink) 45% 55%,transparent 55%) 0 0/18px 18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1}
.dossier{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dossier b{color:var(--ink);font-weight:600}
.hamb{display:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;width:34px;height:34px;cursor:pointer;flex:none}
.menubar{flex:none;background:var(--surface2);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:2px 8px;position:relative;overflow-x:auto}
.mb{border:0;background:transparent;padding:5px 11px;border-radius:5px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.mb:hover,.mb[aria-expanded="true"]{background:var(--accent-soft)}
.dd{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(10,20,40,.22);padding:4px;min-width:230px}
.dd button{display:flex;justify-content:space-between;gap:20px;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:5px;cursor:pointer}
.dd button:hover{background:var(--accent-soft)} .dd .k{color:var(--muted);font-size:12px}
.dd hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.toolbar{flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:4px 8px;overflow-x:auto}
.tb{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;min-width:64px;color:var(--ink);white-space:nowrap}
.tb:hover{background:var(--hover);border-color:var(--line)}
.tb svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tsep{width:1px;background:var(--line);margin:4px 6px;flex:none}

.shell{flex:1;min-height:0;display:flex}
.side{flex:none;width:236px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:8px 0}
.sg{border:0;background:transparent;width:100%;text-align:left;padding:7px 14px;font-family:var(--f-display);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between}
.si{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;text-align:left;padding:6px 14px 6px 22px;cursor:pointer;font-size:13.5px;border-left:3px solid transparent}
.si:hover{background:var(--hover)}
.si[aria-current="page"]{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600;color:var(--ink)}
.si .ct{margin-left:auto;font-size:11px;background:var(--surface2);border-radius:99px;padding:0 7px;color:var(--muted)}
#app{flex:1;min-width:0;overflow:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:14px;align-content:flex-start}
#app>*{flex:none}
.status{flex:none;background:var(--surface2);border-top:1px solid var(--line);padding:4px 12px;display:flex;gap:16px;font-size:12px;color:var(--muted);align-items:center;overflow-x:auto;white-space:nowrap}
.status .ok{color:var(--good)} .status select{width:auto;min-height:0;padding:1px 6px;font-size:12px}

/* Contenus */
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:11px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.banner{background:var(--warn-bg);border:1px solid var(--warn);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 13px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:500;margin-top:3px;overflow-wrap:anywhere}
.kpi.main{grid-column:span 2;border-color:var(--accent)} .kpi.main .v{font-size:24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left}
.tile:hover{border-color:var(--accent);background:var(--hover)}
.tile svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.alert{border-radius:6px;padding:8px 12px;font-size:13.5px;display:flex;gap:10px}
.alert.w{background:var(--warn-bg)} .alert.b{background:var(--bad-bg)} .alert.g{background:var(--good-bg)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:13px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;min-height:34px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:3px 9px;min-height:28px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-height:34px;width:100%;min-width:0;color:var(--ink)}
input[type=checkbox]{width:auto;min-height:0}
textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.glh,.glr{display:grid;grid-template-columns:110px 110px minmax(120px,1fr) 120px 120px 34px;gap:6px;align-items:start}
.glh{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:0 2px}
.glr .acc{display:flex;flex-direction:column}
.glr .lab{font-size:11.5px;color:var(--muted);min-height:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glr input.amt,input.amt{font-family:var(--f-mono);text-align:right}
.gl{display:flex;flex-direction:column;gap:6px}
.tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--surface2);border-radius:6px;padding:8px 12px}
.tot .l{font-size:11.5px;color:var(--muted)} .tot .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}

.phead{display:none}
.doc{background:#fff;color:#111;border:1px solid var(--line);border-radius:4px;padding:28px;display:flex;flex-direction:column;gap:16px;max-width:820px}
.doc table th{background:#EEE;color:#333;position:static} .doc td,.doc th{border-color:#CCC}
.doc h2{font-size:26px;color:#0B6BCB}
.doc .two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.doc .box2{border:1px solid #CCC;border-radius:4px;padding:10px}
@media (prefers-reduced-motion:no-preference){.tb,.btn,.pill,.si,.tile{transition:background .12s,border-color .12s}}

@media (max-width:900px){

<script>
(function(){
  if(!window.Neutralino||(!window.NL_PORT&&!window.NL_TOKEN))return;
  try{Neutralino.init()}catch(e){}
  let dirP=null;
  const dir=()=>dirP||(dirP=(async()=>{
    const d=(await Neutralino.os.getPath('data'))+'/NIA Compta';
    try{await Neutralino.filesystem.createDirectory(d)}catch(e){}
    return d;
  })());
  window.nia={
    read:async n=>{const d=await dir();try{return JSON.parse(await Neutralino.filesystem.readFile(d+'/'+n))}catch(e){}
      try{return JSON.parse(await Neutralino.filesystem.readFile(d+'/'+n+'.bak'))}catch(e){}return null},
    write:async(n,data)=>{const d=await dir(),f=d+'/'+n;
      try{const old=await Neutralino.filesystem.readFile(f);if(old)await Neutralino.filesystem.writeFile(f+'.bak',old)}catch(e){}
      await Neutralino.filesystem.writeFile(f,JSON.stringify(data));return true},
    path:()=>dir(),
    saveFile:async(name,content)=>{const ext=String(name).split('.').pop();
      const p=await Neutralino.os.showSaveDialog('Enregistrer le fichier',{defaultPath:name,filters:[{name:'Fichier',extensions:[ext]}]});
      if(!p)return null;await Neutralino.filesystem.writeFile(p,String(content));return p},
    quit:()=>Neutralino.app.exit()
  };
  Neutralino.events.on('windowClose',()=>{Neutralino.app.exit()});
})();

</script>

/* Montant en lettres (français) */
function enLettres(n,dev){
  const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const T=['','','vingt','trente','quarante','cinquante','soixante'];
  function b100(x){
    if(x<20)return U[x];
    const d=Math.floor(x/10),u=x%10;
    if(d===7||d===9){const base=d===7?'soixante':'quatre-vingt';const r=10+u;return base+(d===7&&u===1?' et ':'-')+U[r]}
    if(d===8)return 'quatre-vingt'+(u===0?'s':'-'+U[u]);
    return T[d]+(u===0?'':(u===1?' et ':'-')+U[u]);
  }
  function b1000(x,fin){
    const c=Math.floor(x/100),r=x%100;let s='';
    if(c>0){s=(c>1?U[c]+' ':'')+'cent'+(c>1&&r===0&&fin?'s':'')}
    if(r>0)s+=(s?' ':'')+b100(r);
    return s;
  }
  function ent(x){
    if(x===0)return 'zéro';
    const parts=[];const mi=Math.floor(x/1e9),m=Math.floor(x%1e9/1e6),k=Math.floor(x%1e6/1000),r=x%1000;
    if(mi)parts.push(b1000(mi,false)+' milliard'+(mi>1?'s':''));
    if(m)parts.push(b1000(m,false)+' million'+(m>1?'s':''));
    if(k)parts.push((k===1?'':b1000(k,false)+' ')+'mille');
    if(r)parts.push(b1000(r,true));
    return parts.join(' ');
  }
  const v=Math.abs(r2(n)),e=Math.floor(v),c=Math.round((v-e)*100);
  const unit=dev==='CDF'?'francs congolais':'dollars américains';
  return (ent(e)+' '+unit+(c?' et '+ent(c)+' centimes':'')).replace(/\s+/g,' ');
}

function lines(o){
  o=o||{};const cur=o.cur||S.aff;
  const from=o.from===undefined?S.du:o.from,to=o.to===undefined?S.au:o.to;
  const out=[];
  for(const e of entries()){
    if(from&&e.date<from)continue;if(to&&e.date>to)continue;
    if(o.noCL&&e.journal==='CL')continue;
    const t=e.taux||S.settings.taux||1;
    e.lignes.forEach((l,i)=>{out.push({e,i,c:String(l.c),t:l.t||'',lib:l.lib||'',lt:l.lt||'',rp:l.rp||'',d:conv(num(l.d),e.devise,t,cur),k:conv(num(l.k),e.devise,t,cur)})});
  }
  return out;
}
function cumulFrom(){
  const y=String(S.settings.exercice);
  return S.entries.some(e=>e.journal==='AN'&&e.date.slice(0,4)===y)?y+'-01-01':'';
}
function balance(ls,byT){
  const m=new Map();
  for(const l of ls){const key=byT?l.c+'|'+l.t:l.c;const o=m.get(key)||{c:l.c,t:byT?l.t:'',d:0,k:0};o.d+=l.d;o.k+=l.k;m.set(key,o)}
  return [...m.values()].sort((a,b)=>a.c.localeCompare(b.c,'fr',{numeric:true})||a.t.localeCompare(b.t));
}
const solde=(bal,prefix)=>bal.filter(o=>o.c.startsWith(prefix)).reduce((s,o)=>s+o.d-o.k,0);
function resultat(bal){
  let prod=0,chg=0;const P=[],C=[];
  for(const o of bal){
    const s=o.d-o.k,cl=o.c[0];
    if(cl==='7'||(cl==='8'&&s<0)){P.push({c:o.c,v:-s});prod+=-s}
    else if(cl==='6'||(cl==='8'&&s>=0)){C.push({c:o.c,v:s});chg+=s}
  }
  return {P,C,prod,chg,res:prod-chg};
}
function putEntry(e){if(S.user&&!e.u)e.u=S.user.login;const i=S.entries.findIndex(x=>x.id===e.id);if(i>=0)S.entries[i]=e;else S.entries.push(e)}
function dropEntry(id){S.entries=S.entries.filter(x=>x.id!==id)}
function entryById(id){return S.entries.find(x=>x.id===id)}
function nextLetter(){
  const used=new Set();
  for(const e of S.entries)for(const l of e.lignes)if(l.lt)used.add(l.lt);
  const gen=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
  for(let i=0;;i++){const s=gen(i);if(!used.has(s))return s}
}
function unletter(letter,tiers){
  for(const e of S.entries)for(const l of e.lignes)if(l.lt===letter&&(!tiers||l.t===tiers))delete l.lt;
}

function navActive(it){
  if(S.view!==it[0])return false;
  if(it[3]===undefined)return true;
  if(it[0]==='etat')return S.rep===it[3];
  if(it[0]==='factures')return S.ft===it[3];

}

let tt;

const H=(t,n,x)=>({t,n:!!n,x:!!x});
function tbl(title,head,rows,foot){
  const keep=head.map(h=>!h.x);
  S.exp.push({title,head:head.filter((h,i)=>keep[i]).map(h=>h.t),num:head.filter((h,i)=>keep[i]).map(h=>h.n),rows:rows.filter(r=>!r.grp).map(r=>r.filter((c,i)=>keep[i])),foot:foot&&foot.filter((c,i)=>keep[i])});
  const th=head.map(h=>`<th class="${h.n?'n':''} ${h.x?'noprint':''}">${esc(h.t)}</th>`).join('');
  const cell=(c,i)=>`<td class="${head[i]&&head[i].n?'n':''} ${head[i]&&head[i].x?'noprint':''}">${c}</td>`;
  const tr=rows.map(r=>r.grp?`<tr class="grp"><td colspan="${head.length}">${r.grp}</td></tr>`:`<tr>${r.map(cell).join('')}</tr>`).join('');
  const ft=foot?`<tr class="total">${foot.map(cell).join('')}</tr>`:'';
  return `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${tr||`<tr><td colspan="${head.length}" class="muted">Aucune donnée sur la période.</td></tr>`}${ft}</tbody></table></div>`;
}

const VIEWS={};
function rerender(force){
  const app=$('#app'),ae=document.activeElement;
  if(S.ready&&!authOk()){renderGate();return}
  renderChrome();
  if(S.modal)return;
  if(!force&&(S.view==='saisie'||S.view==='facture')&&app.contains(ae)&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName))return;
  S.exp=[];
  const fn=VIEWS[S.view]||VIEWS.home;
  let html;try{html=fn()}catch(e){html='<div class="alert b">Une erreur est survenue dans cet écran : '+esc(e.message)+'</div>'}
  app.innerHTML=html;
  if(S.view==='saisie')updateTotals();
  if(S.view==='facture')updateFactTotals();
}
function go(v,s){
  if(!canView(v)){toast('Accès non autorisé pour votre profil.');return}
  S.view=v;S.confirm=null;
  if(v==='etat'&&s)S.rep=s;
  if(v==='fin'&&s)S.finrep=s;
  if(v==='factures'&&s)S.ft=s;
  if(v==='facture'&&!S.fv)S.fv=newFacture(S.ft);
  $('#side').classList.remove('open');
  rerender(true);$('#app').scrollTop=0;
}

  if(solde(allBal,'57')<0)al.push(['b','La caisse est créditrice. Une caisse ne peut pas être négative : vérifiez les dates et les montants.']);
  if(solde(allBal,'411')<0)al.push(['w','Le compte Clients est créditeur. Un client a peut-être payé en trop ou un règlement est mal imputé.']);
  if(solde(allBal,'401')>0)al.push(['w','Le compte Fournisseurs est débiteur. Un règlement dépasse peut-être la facture.']);
  const late=S.factures.filter(f=>factReste(f)>0.004&&f.echeance&&f.echeance<iso(new Date())).sort((a,b)=>a.echeance.localeCompare(b.echeance));
  if(late.length)al.push(['w',late.length+' facture'+(late.length>1?'s':'')+' en retard de paiement.']);
  const emptyTiers=S.entries.some(e=>e.lignes.some(l=>/^(411|401)/.test(String(l.c))&&!l.t));
  if(emptyTiers&&S.tiers.length)al.push(['w','Certaines écritures sur les comptes clients ou fournisseurs n’ont pas de tiers : la balance âgée sera incomplète.']);
  const cnt=entries().filter(e=>e.date>=S.du&&e.date<=S.au).length;
  const tiles=[['plus','Saisie','saisie'],['file','Factures clients','factures','V'],['file','Factures fournisseurs','factures','A'],['users','Tiers','tiers'],['link','Lettrage','lettrage'],['bank','Rapprochement','rapprochement'],['percent','TVA','tva'],['building','Immobilisations','immos'],['lock','Clôture','cloture'],['chart','Bilan','etat','bilan']];
  return demoBanner()+periodBar()+`
  <div class="kpis">
    <div class="kpi main"><div class="l">Résultat de la période</div><div class="v ${R.res>=0?'pos':'neg'}">${money(R.res,S.aff)}</div></div>
    <div class="kpi"><div class="l">Produits</div><div class="v">${money(R.prod,S.aff)}</div></div>
    <div class="kpi"><div class="l">Charges</div><div class="v">${money(R.chg,S.aff)}</div></div>
    <div class="kpi"><div class="l">Trésorerie</div><div class="v ${treso<0?'neg':''}">${money(treso,S.aff)}</div></div>
    <div class="kpi"><div class="l">Clients à encaisser</div><div class="v">${money(cli,S.aff)}</div></div>
    <div class="kpi"><div class="l">Fournisseurs à payer</div><div class="v">${money(fou,S.aff)}</div></div>
    <div class="kpi"><div class="l">Écritures</div><div class="v">${cnt}</div></div>
  </div>
  <div class="card noprint"><h3>Accès rapide</h3><div class="tiles">${tiles.map(t=>`<button class="tile" data-act="go" data-v="${t[2]}" data-s="${t[3]||''}">${ico(t[0])}<span>${t[1]}</span></button>`).join('')}</div></div>
  <div class="card"><h3>Produits et charges par mois</h3>${chart()}</div>
  ${late.length?`<div class="card"><h3>Factures en retard</h3>${tbl('Factures en retard',[H('Facture'),H('Tiers'),H('Échéance'),H('Reste dû',1)],late.slice(0,6).map(f=>[esc(f.numero),esc(tiersNom(f.tiers)),fdate(f.echeance),money(factReste(f),f.devise)]))}</div>`:''}
  <div class="card"><h3>Points d’attention</h3>${al.length?al.map(a=>`<div class="alert ${a[0]}">${esc(a[1])}</div>`).join(''):'<div class="alert g">Aucune anomalie détectée sur les soldes de caisse, clients et fournisseurs.</div>'}</div>`;
};
function chart(){
  const y=S.settings.exercice,P=Array(12).fill(0),C=Array(12).fill(0);
  for(const e of entries()){
    if(String(e.date).slice(0,4)!==String(y)||e.journal==='CL')continue;
    const m=parseInt(String(e.date).slice(5,7),10)-1,t=e.taux||S.settings.taux||1;
    for(const l of e.lignes){
      const c=String(l.c)[0],s=conv(num(l.k)-num(l.d),e.devise,t,S.aff);
      if(c==='7')P[m]+=s;else if(c==='6')C[m]-=s;
    }
  }
  const mx=Math.max(1,...P,...C),W=360,Hh=140,x0=34,bw=9,gap=(W-x0-6)/12;
  let g=`<line class="gl2" x1="${x0}" y1="${Hh-20}" x2="${W}" y2="${Hh-20}"/><line class="gl2" x1="${x0}" y1="10" x2="${W}" y2="10"/>`;
  g+=`<text x="${x0-4}" y="${Hh-17}" text-anchor="end">0</text><text x="${x0-4}" y="13" text-anchor="end">${fmtN(mx>=1000?Math.round(mx/1000):mx,S.aff).replace(/\s/g,'')}${mx>=1000?'k':''}</text>`;
  const L='JFMAMJJASOND';
  for(let i=0;i<12;i++){
    const hx=x0+i*gap+3,hp=(P[i]/mx)*(Hh-30),hc=(Math.max(C[i],0)/mx)*(Hh-30);
    g+=`<rect class="bp" x="${hx}" y="${Hh-20-hp}" width="${bw}" height="${Math.max(hp,0)}" rx="1"/><rect class="bc" x="${hx+bw+1}" y="${Hh-20-hc}" width="${bw}" height="${hc}" rx="1"/><text x="${hx+bw}" y="${Hh-6}" text-anchor="middle">${L[i]}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Produits et charges par mois de l’exercice ${y}" style="width:100%;max-height:260px;height:auto">${g}</svg><div class="legend"><span><i style="background:var(--accent)"></i>Produits</span><span><i style="background:var(--sun)"></i>Charges</span><span>Exercice ${y}, en ${S.aff}</span></div>`;
}

   <p class="small muted" style="margin:0">Taux appliqué à l’enregistrement : 1 USD = ${fmtN(S.settings.taux,'CDF')} CDF.</p></div>`;
};
function draftTotals(){
  const d=S.draft;let D=0,K=0,n=0;
  for(const l of d.lignes){const a=num(l.d),b=num(l.k);D+=a;K+=b;if(String(l.c).trim()&&(a>0||b>0))n++}
  return {D:r2(D),K:r2(K),n};
}
function draftOk(){
  const t=draftTotals(),d=S.draft,e=r2(t.D-t.K);
  if(Math.abs(e)>=0.005)return ['w','Écriture déséquilibrée : il manque '+fmtN(Math.abs(e),d.devise)+' au '+(e>0?'crédit':'débit')+'.'];
  if(t.n<2)return ['w','Saisissez au moins deux lignes avec un compte et un montant.'];
  if(!d.libelle.trim())return ['w','Ajoutez un libellé.'];
  if(!d.date)return ['w','Indiquez une date.'];
  if(!d.lignes.every(l=>!String(l.c).trim()||/^\d{2,8}$/.test(String(l.c).trim())))return ['w','Vérifiez les numéros de compte : chiffres uniquement, de 2 à 8.'];
  if(d.lignes.some(l=>l.t&&!tiersOf(l.t)))return ['w','Un code tiers n’existe pas. Créez-le dans Tiers ou videz la case.'];
  if(locked(d.date))return ['w','Exercice clôturé pour cette date.'];
  const o=d.id&&entryById(d.id);if(o&&locked(o.date))return ['w','L’écriture appartient à un exercice clôturé.'];
  if(o&&o.src&&o.src[0]!=='B')return ['w','Écriture générée automatiquement : modification impossible ici.'];
  return ['g','Écriture équilibrée.'];
}
function updateTotals(){
  if(!$('#t-d'))return;
  const t=draftTotals(),d=S.draft,e=r2(t.D-t.K),st=draftOk();
  $('#t-d').textContent=fmtN(t.D,d.devise);$('#t-k').textContent=fmtN(t.K,d.devise);$('#t-e').textContent=fmtN(e,d.devise);
  const m=$('#t-msg');m.className='alert '+st[0];m.textContent=st[1];
  $('#btn-save').disabled=st[0]!=='g';
}
async function saveDraft(){

/* ================= Factures ================= */
const defDate=()=>S.settings.exercice===YEAR?iso(new Date()):S.settings.exercice+'-12-31';
function factTotals(f){
  let ht=0,tb=0;
  for(const l of f.lignes){const m=r2(num(l.qte)*num(l.pu));ht+=m;if(l.tva)tb+=m}
  const tva=r2(tb*num(f.tvaTaux)/100);
  return {ht:r2(ht),tva,ttc:r2(ht+tva)};
}
const factPaye=f=>r2((f.reglements||[]).reduce((s,r)=>s+num(r.montant),0));
const factReste=f=>r2(factTotals(f).ttc-factPaye(f));
function factStatut(f){
  const r=factReste(f);if(r<=0.004)return ['ok','Payée'];
  if(f.echeance&&f.echeance<iso(new Date()))return ['late','En retard'];
  return factPaye(f)>0?['part','Partielle']:['open','À payer'];
}
function newFacture(type){
  const d=defDate(),y=d.slice(0,4),n=S.factures.filter(f=>f.type===type&&String(f.date).slice(0,4)===y).length+1;
  const tvaOk=num(S.settings.tva)>0;
  return {id:null,type,numero:(type==='V'?'FV-':'FA-')+y+'-'+String(n).padStart(4,'0'),date:d,echeance:addDays(d,num(S.settings.delai)||0),autoEch:true,tiers:'',devise:'USD',tvaTaux:S.settings.tva||'',
    lignes:[{lib:'',qte:'1',pu:'',compte:type==='V'?'701':'601',tva:tvaOk}],notes:'',reglements:[]};
}
VIEWS.factures=function(){
  const type=S.ft,isV=type==='V',q=(S.fq||'').toLowerCase();
  let L=S.factures.filter(f=>f.type===type&&f.date>=S.du&&f.date<=S.au);
  if(S.pf==='open')L=L.filter(f=>factReste(f)>0.004);
  if(q)L=L.filter(f=>(f.numero+' '+tiersNom(f.tiers)).toLowerCase().includes(q));
  L.sort((a,b)=>b.date.localeCompare(a.date)||b.numero.localeCompare(a.numero));
  let tt=0,tp=0,tr=0,tl=0;
  for(const f of S.factures.filter(f=>f.type===type&&f.date>=S.du&&f.date<=S.au)){const c=t=>conv(t,f.devise,f.taux||S.settings.taux,S.aff);tt+=c(factTotals(f).ttc);tp+=c(factPaye(f));tr+=c(factReste(f));if(factStatut(f)[0]==='late')tl+=c(factReste(f))}
  const rows=L.map(f=>{const T=factTotals(f),st=factStatut(f);
    return [esc(f.numero),fdate(f.date),esc(tiersNom(f.tiers)),fdate(f.echeance),fmtN(T.ht,f.devise),fmtN(T.ttc,f.devise),fmtN(factPaye(f),f.devise),fmtN(factReste(f),f.devise),esc(f.devise),`<span class="st ${st[0]}">${st[1]}</span>`,`<button class="btn sm" data-act="openfact" data-id="${esc(f.id)}">Ouvrir</button>`]});
  return pageHead(isV?'Factures clients':'Factures fournisseurs','Facturation','<button class="btn primary" data-act="newfact" data-v="'+type+'">'+(isV?'Nouvelle facture':'Saisir une facture reçue')+'</button>')+periodBar()+
  `<div class="kpis"><div class="kpi"><div class="l">${isV?'Facturé':'Reçu'} (TTC)</div><div class="v">${money(tt,S.aff)}</div></div><div class="kpi"><div class="l">${isV?'Encaissé':'Payé'}</div><div class="v">${money(tp,S.aff)}</div></div><div class="kpi"><div class="l">Reste dû</div><div class="v">${money(tr,S.aff)}</div></div><div class="kpi"><div class="l">En retard</div><div class="v ${tl>0?'neg':''}">${money(tl,S.aff)}</div></div></div>
  <div class="card noprint"><div class="grid2"><label>Recherche<input id="f-q" data-b="fq" data-live="1" value="${esc(S.fq||'')}" placeholder="Numéro ou tiers"></label><label>Afficher<select id="f-pf" data-b="pf" data-rr="1"><option value="">Toutes</option><option value="open" ${S.pf==='open'?'selected':''}>Non soldées</option></select></label></div></div>`+
  tbl(isV?'Factures clients':'Factures fournisseurs',[H('Numéro'),H('Date'),H('Tiers'),H('Échéance'),H('HT',1),H('TTC',1),H(isV?'Encaissé':'Payé',1),H('Reste',1),H('Devise'),H('Statut'),H('',0,1)],rows)+
  '<p class="small muted noprint" style="margin:0">Les montants de ce tableau sont dans la devise de chaque facture. Les totaux ci-dessus sont convertis en '+S.aff+'.</p>';
};
function factValid(f){
  if(!f.tiers||!tiersOf(f.tiers))return 'Choisissez un tiers.';
  if(!String(f.numero).trim())return 'Indiquez le numéro de la facture.';
  if(!f.date)return 'Indiquez la date.';
  const L=f.lignes.filter(l=>String(l.lib||'').trim()&&num(l.pu)!==0);
  if(!L.length)return 'Ajoutez au moins une ligne avec un libellé et un prix.';
  if(L.some(l=>!/^\d{2,8}$/.test(String(l.compte).trim())))return 'Vérifiez le compte de chaque ligne (chiffres uniquement).';
  if(L.some(l=>l.tva)&&!(num(f.tvaTaux)>0))return 'Renseignez le taux de TVA dans Réglages ou décochez la TVA.';
  if(locked(f.date))return 'L’exercice de cette date est clôturé.';

function buildFactEntry(f){

  if(isV){P('411',T.ttc,0,'Facture '+f.numero,f.tiers);for(const l of f.lignes)P(l.compte,0,r2(l.qte*l.pu),l.lib);P('4431',0,T.tva)}
  else{for(const l of f.lignes)P(l.compte,r2(l.qte*l.pu),0,l.lib);P('4452',T.tva,0);P('401',0,T.ttc,'Facture '+f.numero,f.tiers)}

  new Set(tl.map(l=>l.lt).filter(Boolean)).forEach(L=>unletter(L,f.tiers));

/* ================= Immobilisations ================= */
function immoYear(im,Y){
  const ay=parseInt(im.date.slice(0,4),10),am=parseInt(im.date.slice(5,7),10),s=ay*12+am-1,n=Math.max(1,Math.round(num(im.duree)*12)),v=num(im.valeur);
  let end=s+n,cy=0;
  if(im.cession&&im.cession.date){cy=parseInt(im.cession.date.slice(0,4),10);end=Math.min(end,cy*12+parseInt(im.cession.date.slice(5,7),10));}
  const months=y=>Math.max(0,Math.min(end,y*12+12)-Math.max(s,y*12));
  const cum=y=>{
    if(im.methode==='D'&&num(im.coef)>0){
      const rate=num(im.coef)/num(im.duree);let c=0;
      for(let k=ay;k<=y;k++){
        const m=months(k);if(m<=0)continue;
        const vnc=v-c,done=Math.max(0,Math.max(s,k*12)-s),rem=Math.max(1,n-done);
        const dg=vnc*rate*m/12,li=vnc*m/rem;
        c+=Math.min(vnc,Math.max(dg,li));
      }
      return r2(c);
    }
    return r2(v*Math.min(Math.max(0,Math.min(end,y*12+12)-s),n)/n);
  };
  if(cy&&Y>cy)return {dot:0,cumul:0,vnc:0,cede:true};
  const c=cum(Y);return {dot:r2(c-cum(Y-1)),cumul:c,vnc:cy&&Y===cy?0:r2(v-c),cede:!!cy};
}

async function genDotations(){
  const Y=S.settings.exercice;
  if(locked(Y+'-12-31')){toast('Exercice clôturé.');return}
  let n=0;
  for(const im of S.immos){
    const id='dot-'+im.id+'-'+Y;dropEntry(id);
    if(im.cession)continue;
    const y=immoYear(im,Y);if(y.dot<=0.004)continue;
    putEntry({id,date:Y+'-12-31',journal:'OD',piece:nextPiece('OD'),libelle:'Dotation aux amortissements '+Y+' – '+im.lib,devise:im.devise,taux:num(S.settings.taux)||1,src:'I:'+im.id,
      lignes:[{c:'681',d:y.dot,k:0,lib:im.lib},{c:amortAcc(im.compte),d:0,k:y.dot,lib:im.lib}]});n++;
  }

/* ---- Cession d'immobilisation ---- */
function cessionVNC(im,date,prix){
  const Y=parseInt(date.slice(0,4),10),tmp=Object.assign({},im,{cession:{date}}),y=immoYear(tmp,Y);
  const prev=S.entries.filter(e=>e.src==='I:'+im.id&&e.id!=='ces-'+im.id).reduce((t,e)=>t+e.lignes.reduce((u,l)=>u+(+l.k||0),0),0);
  const v=num(im.valeur),cum=r2(Math.max(0,Math.min(v,y.cumul)));
  return {cum,vnc:r2(v-cum),dotCompl:r2(Math.max(0,cum-prev)),prix:num(prix),pv:r2(num(prix)-(v-cum))};
}

/* ================= Paie ================= */
function PA_DEF(){return {params:{devise:'USD',cnssSal:'',cnssEmp:'',plafondCnss:'',inpp:'',onem:'',abat:'',baremeBase:'annuel',baremeDevise:'CDF',tranches:[],chargeRed:'',chargeMax:'',iprMax:'',cRem:'661',cChg:'664',cPers:'422',cOrg:'431',cImp:'447',cAv:'421'},employes:[],runs:[]}}
function normPaie(v){
  const d=PA_DEF();if(!v)return d;
  const p=Object.assign(d.params,v.params||{});p.tranches=((v.params&&v.params.tranches)||[]).map(t=>Object.assign({},t));
  return {params:p,employes:(v.employes||[]).map(e=>Object.assign({},e)),runs:(v.runs||[])};
}
const paP=()=>S.paie.params;
const pRd=x=>paP().devise==='CDF'?Math.round(x):r2(x);
const pFmt=x=>fmtN(x,paP().devise);
const pMoney=x=>money(x,paP().devise);
function paParamsOk(){const P=paP();return !(P.cnssSal===''&&P.cnssEmp===''&&P.inpp===''&&P.onem===''&&!P.tranches.length)}
const lastDay=ym=>ym+'-'+z2(new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate());
function defMois(){const Y=S.settings.exercice,t=iso(new Date());return t.slice(0,4)===String(Y)?t.slice(0,7):Y+'-12'}
function curMois(){let m=S.pa.mois||defMois();if(m.slice(0,4)!==String(S.settings.exercice))m=S.settings.exercice+m.slice(4);return m}
const runOf=ym=>S.paie.runs.find(r=>r.periode===ym);
function runEnsure(ym){let r=runOf(ym);if(!r){r={id:uid(),periode:ym,statut:'brouillon',variables:{}};S.paie.runs.push(r)}if(!r.variables)r.variables={};return r}
const empOf=id=>S.paie.employes.find(e=>e.id===id);

function iprCalc(base,emp){
  const P=paP(),tx=num(S.settings.taux)||1,bd=P.baremeDevise;
  let b=conv(base,P.devise,tx,bd);if(P.baremeBase==='annuel')b*=12;
  const T=P.tranches.map(t=>({lo:num(t.de),hi:String(t.a==null?'':t.a).trim()===''?Infinity:num(t.a),r:num(t.taux)})).sort((a,c)=>a.lo-c.lo);
  let tax=0;for(const t of T)if(b>t.lo)tax+=(Math.min(b,t.hi)-t.lo)*t.r/100;
  if(P.baremeBase==='annuel')tax/=12;
  tax=conv(tax,bd,tx,P.devise);
  const n=Math.min(num(emp.charges),num(P.chargeMax));
  if(num(P.chargeRed)>0&&n>0)tax*=1-n*num(P.chargeRed)/100;
  if(num(P.iprMax)>0)tax=Math.min(tax,base*num(P.iprMax)/100);
  return Math.max(0,tax);
}
function calcBulletin(emp,vars){
  const P=paP(),g=[{lib:'Salaire de base',montant:num(emp.base),imp:true,cot:true}],aut=[];
  for(const i of emp.indemnites||[])if(num(i.montant))g.push({lib:i.lib||'Indemnité',montant:num(i.montant),imp:!!i.imp,cot:!!i.cot});
  for(const v of vars||[]){if(v.type==='R')aut.push({lib:v.lib||'Retenue',montant:num(v.montant)});else g.push({lib:v.lib||'Prime',montant:num(v.montant),imp:!!v.imp,cot:!!v.cot})}
  const brut=pRd(g.reduce((s,x)=>s+x.montant,0));
  let bc=g.filter(x=>x.cot).reduce((s,x)=>s+x.montant,0);if(num(P.plafondCnss)>0)bc=Math.min(bc,num(P.plafondCnss));
  const cnssSal=pRd(bc*num(P.cnssSal)/100),cnssEmp=pRd(bc*num(P.cnssEmp)/100),inpp=pRd(brut*num(P.inpp)/100),onem=pRd(brut*num(P.onem)/100);
  let imposable=g.filter(x=>x.imp).reduce((s,x)=>s+x.montant,0)-cnssSal;
  imposable=Math.max(0,imposable*(1-num(P.abat)/100));
  const ipr=pRd(iprCalc(imposable,emp)),autres=pRd(aut.reduce((s,x)=>s+x.montant,0)),net=pRd(brut-cnssSal-ipr-autres);
  return {emp:emp.id,matricule:emp.matricule,nom:emp.nom,poste:emp.poste,embauche:emp.embauche||'',charges:num(emp.charges),gains:g,aut,brut,baseCot:pRd(bc),cnssSal,cnssEmp,inpp,onem,imposable:pRd(imposable),ipr,autres,net,chargesPat:pRd(cnssEmp+inpp+onem),cout:pRd(brut+cnssEmp+inpp+onem)};
}
function runLines(ym){
  const r=runOf(ym);if(r&&r.snap)return r.snap;
  return S.paie.employes.filter(e=>e.actif!==false).map(e=>calcBulletin(e,(r&&r.variables&&r.variables[e.id])||[]));
}
function paTot(L){
  const t={brut:0,cnssSal:0,cnssEmp:0,inpp:0,onem:0,ipr:0,autres:0,net:0,chargesPat:0,cout:0};
  for(const l of L)for(const k in t)t[k]+=l[k];
  for(const k in t)t[k]=pRd(t[k]);return t;
}

ACT.pvalid=async()=>{
  const ym=curMois(),L=runLines(ym);
  if(!L.length){toast('Aucun employé actif.');return}
  if(!paParamsOk()){toast('Renseignez d’abord les paramètres de paie.');return}
  const date=lastDay(ym);if(locked(date)){toast('Exercice clôturé.');return}
  const r=runEnsure(ym),T=paTot(L),P=paP(),lg=[];
  const push=(c,d,k)=>{if(d||k)lg.push({c:String(c),d:r2(d),k:r2(k)})};
  push(P.cRem,T.brut,0);push(P.cChg,T.chargesPat,0);push(P.cPers,0,T.net);push(P.cOrg,0,T.cnssSal+T.cnssEmp+T.inpp+T.onem);push(P.cImp,0,T.ipr);push(P.cAv,0,T.autres);

};

/* ================= Import Excel/CSV : clients, fournisseurs, employés ================= */
async function fileText(f){
  if(/\.xlsx$/i.test(f.name)){
    const buf=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsArrayBuffer(f)});
    return {txt:await xlsxToText(buf),delim:'\t'};
  }
  if(/\.xls$/i.test(f.name)){const e=new Error('xls');e.xls=true;throw e}
  const rd=enc=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result));fr.onerror=()=>rej(fr.error);fr.readAsText(f,enc)});
  let t=await rd('utf-8');if(t.includes('�'))t=await rd('windows-1252');
  return {txt:t,delim:'auto'};
}
const NORM=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function mapCols(head,defs){
  const h=head.map(NORM),m={},used=new Set();
  for(const [k,re] of defs){const i=h.findIndex((x,j)=>!used.has(j)&&re.test(x));if(i>=0){m[k]=i;used.add(i)}}
  return m;
}
const TI_COLS=[['type',/^type|categorie|nature/],['code',/code|^id$|^n°|numero tiers/],['nom',/nom|raison|societe|denomination|client|fournisseur|designation/],['adresse',/adresse|address|localisation/],['tel',/tel|phone|mobile|gsm/],['email',/mail|courriel/],['nif',/nif|impot|rccm|n° fiscal|numero fiscal/],['compte',/compte|collectif/]];
const EM_COLS=[['mat',/matricule|^id$|^n°|code/],['nom',/nom|employe|salarie|agent/],['poste',/poste|fonction|emploi/],['emb',/embauche|entree|engagement|date/],['base',/salaire|base|brut|remuneration/],['ch',/charge|enfant|famille/]];
async function readSource(prefix){
  const f=$('#'+prefix+'-file')&&$('#'+prefix+'-file').files[0];
  let r;
  if(f)r=await fileText(f);else{const raw=$('#'+prefix+'-raw').value;if(!raw.trim())throw new Error('vide');r={txt:raw,delim:'auto'}}
  return parseTable(r.txt,r.delim).rows;
}
const impErr=e=>e&&e.xls?'Ancien format .xls non pris en charge : enregistrez en .xlsx ou CSV.':e&&e.message==='vide'?'Choisissez un fichier ou collez les lignes.':'Lecture impossible (classeur .xlsx, CSV ou texte attendu).';

function normStocks(v){return {articles:((v&&v.articles)||[]).map(a=>Object.assign({},a)),mvts:((v&&v.mvts)||[]).map(m=>Object.assign({},m))}}
const artOf=id=>S.stocks.articles.find(a=>a.id===id);
function stockCalc(upTo){
  const res={};
  S.stocks.articles.forEach(a=>{res[a.id]={qty:0,val:0,cmup:0,neg:false}});
  const mv=S.stocks.mvts.filter(m=>!upTo||m.date<=upTo).slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.seq||0)-(b.seq||0));
  for(const m of mv){
    const r=res[m.art];if(!r)continue;const q=num(m.qte);
    if(m.type==='E'){r.qty+=q;r.val+=q*num(m.pu);r.cmup=r.qty>0?r.val/r.qty:r.cmup}
    else if(m.type==='S'){const c=r.qty>0?r.val/r.qty:r.cmup;r.val-=q*c;r.qty-=q;if(r.qty<-1e-9)r.neg=true;r.cmup=c}
    else if(m.type==='I'){const c=r.qty>0?r.val/r.qty:r.cmup;r.qty=q;r.val=q*c;r.cmup=c}
  }
  for(const k in res){res[k].val=r2(res[k].val);res[k].qty=Math.round(res[k].qty*1e6)/1e6}
  return res;
}

const invDate=()=>S.settings.exercice+'-12-31';
function invAdjust(){
  const date=invDate(),C=stockCalc(date),F={};
  for(const a of S.stocks.articles){F[a.compte]=(F[a.compte]||0)+C[a.id].val}
  const bal=balance(lines({from:cumulFrom(),to:date,cur:'USD',noCL:true}).filter(l=>l.e.id!=='stk-'+S.settings.exercice));
  const B={};for(const o of bal)if(stkAcc(o.c))B[o.c]=(B[o.c]||0)+o.d-o.k;
  const out=[];
  for(const c of new Set([...Object.keys(F),...Object.keys(B)])){const adj=r2((F[c]||0)-(B[c]||0));if(Math.abs(adj)>=0.005)out.push({c,final:r2(F[c]||0),book:r2(B[c]||0),adj})}
  return out;
}

/* hachage PBKDF2 et chiffrement AES-GCM (WebCrypto) */
const hex=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16)));
const b64=b=>{let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb64=t=>{const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function pwHash(pw,saltHex){
  const salt=saltHex?unhex(saltHex):rnd(16);
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},key,256);
  return {salt:hex(salt),hash:hex(bits)};
}
async function kek(secret,saltHex){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(secret),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unhex(saltHex),iterations:150000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function wrapWith(secret,raw){
  const ks=hex(rnd(16)),iv=rnd(12),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await kek(secret,ks),raw);
  return {ks,wiv:b64(iv),wct:b64(ct)};
}
async function unwrapWith(secret,w){
  try{return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(w.wiv)},await kek(secret,w.ks),unb64(w.wct)))}catch(e){return null}
}
async function setDK(raw){S.dkRaw=raw;S.dk=await crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt'])}
async function encJson(d){
  if(!S.dk)throw new Error('locked');
  const iv=rnd(12),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},S.dk,new TextEncoder().encode(JSON.stringify(d)));
  return {enc:1,iv:b64(iv),ct:b64(ct)};
}
async function decJson(v){
  if(!S.dk)throw new Error('locked');
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},S.dk,unb64(v.ct))));
}
function genRecovery(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=rnd(32);let s='';
  for(let i=0;i<32;i++)s+=A[b[i]%32];
  return s.match(/.{4}/g).join('-');
}
const normRec=x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function usersSave(){await window.nia.write('users.json',{users:S.users,recovery:S.recovery||null,enc:true})}
async function authInit(){
  let u=null;try{u=await window.nia.read('users.json')}catch(e){}
  S.users=(u&&u.users)||[];S.recovery=(u&&u.recovery)||null;S.user=null;S.dk=null;S.dkRaw=null;S.fails={n:0,until:0};
  S.auth={state:S.users.length?'login':'setup'};
}
const encActive=()=>!!S.recovery||S.users.some(u=>u.wct);
async function installDK(u,pw){
  const raw=rnd(32);await setDK(raw);
  Object.assign(u,await wrapWith(pw,raw));
  const rk=genRecovery();S.recovery=await wrapWith(normRec(rk),raw);S.pendingRecovery=rk;
}

  $('#app').innerHTML=`<div class="gate card" id="gate"><h2>NIA Compta</h2>

ACT.login=async()=>{

  if(S.fails.until>now){S.auth.msg='Trop d’essais. Patientez '+Math.ceil((S.fails.until-now)/1000)+' s.';rerender(true);return}
  const login=$('#lg-user').value.trim().toLowerCase(),p=$('#lg-pass').value,u=S.users.find(x=>x.login===login);
  const h=u?await pwHash(p,u.salt):await pwHash(p);

    else if(!encActive()&&u.role==='admin'){await installDK(u,p);await usersSave()}
    else{S.auth.msg=encActive()?'Compte à réactiver : demandez à l’administrateur de réinitialiser votre mot de passe.':'L’administrateur doit se connecter en premier pour activer le chiffrement.';rerender(true);return}

/* ================= Écarts de change (réévaluation à la clôture) ================= */
function fxP(){const s=S.settings;if(!s.fx)s.fx={cloture:'',actif:'478',passif:'479',perte:'676',gain:'776'};return s.fx}
const FX_MON=['40','41','42','43','44','45','46','47','48','52','53','57'],FX_TRE=['52','53','57'],FX_EXC=['478','479'];
function fxCalc(){
  const Y=S.settings.exercice,P=fxP(),tc=num(P.cloture),g={};
  for(const e of S.entries){
    if(e.date<Y+'-01-01'||e.date>Y+'-12-31'||e.journal==='CL'||e.journal==='AN'||/^fxe?-/.test(e.id)||e.devise==='USD')continue;
    const tx=e.taux||S.settings.taux||1;
    for(const l of e.lignes){
      const c=String(l.c);if(FX_EXC.includes(c)||!FX_MON.some(p=>c.startsWith(p)))continue;
      const k=c+'|'+(l.t||'')+'|'+e.devise,o=g[k]=g[k]||{c,t:l.t||'',dev:e.devise,nat:0,hist:0};
      const dd=num(l.d)-num(l.k);o.nat+=dd;o.hist+=conv(dd,e.devise,tx,'USD');
    }
  }
  const rows=[];
  for(const k in g){
    const o=g[k],tre=FX_TRE.some(p=>o.c.startsWith(p)),zero=Math.abs(o.nat)<(o.dev==='CDF'?0.5:0.005);
    let adj,kind;
    if(zero){adj=-o.hist;kind='real'}
    else{if(!(tc>0))continue;adj=conv(o.nat,o.dev,tc,'USD')-o.hist;kind=tre?'tre':'lat'}
    adj=r2(adj);if(Math.abs(adj)<0.005)continue;
    rows.push({c:o.c,t:o.t,dev:o.dev,nat:o.nat,hist:r2(o.hist),clo:zero?0:r2(conv(o.nat,o.dev,tc,'USD')),adj,kind});
  }
  return rows.sort((a,b)=>a.c.localeCompare(b.c,'fr',{numeric:true})||a.t.localeCompare(b.t));
}
function fxLines(rows,P){
  const L=[],E=[];
  for(const r of rows){
    const v=Math.abs(r.adj),acc={c:r.c,d:0,k:0};if(r.t)acc.t=r.t;
    const pos=r.adj>0,ctr=r.kind==='lat'?(pos?P.passif:P.actif):(pos?P.gain:P.perte);
    const a=Object.assign({},acc),b={c:String(ctr),d:0,k:0};
    if(pos){a.d=v;b.k=v}else{b.d=v;a.k=v}
    L.push(a,b);
    if(r.kind==='lat'){E.push(Object.assign({},a,{d:a.k,k:a.d}),Object.assign({},b,{d:b.k,k:b.d}))}
  }
  return {L,E};
}

  const tr=rows.map(r=>[esc(r.c)+' '+esc(accName(r.c)),esc(r.t?tiersNom(r.t):''),esc(r.dev),fmtN(r.nat,r.dev),fmtN(r.hist,'USD'),r.kind==='real'?'':fmtN(r.clo,'USD'),fmtN(r.adj,'USD'),KIND[r.kind]]);
  const g=r2(rows.filter(r=>r.adj>0).reduce((s,r)=>s+r.adj,0)),p=r2(rows.filter(r=>r.adj<0).reduce((s,r)=>s-r.adj,0));

   <div class="grid4">${f('fx-t','Taux de clôture (CDF pour 1 USD)','cloture',P.cloture)}${f('fx-a','Écart de conversion - Actif','actif',P.actif)}${f('fx-p','Écart de conversion - Passif','passif',P.passif)}${f('fx-l','Pertes de change','perte',P.perte)}${f('fx-g','Gains de change','gain',P.gain)}</div>
   <p class="small muted" style="margin:6px 0 0">Comptes proposés d’après le SYSCOHADA révisé (478, 479, 676, 776) : à confirmer avec votre comptable.</p></div>`+
  (rows.length?tbl('Réévaluation au 31/12/'+Y,[H('Compte'),H('Tiers'),H('Devise'),H('Solde en devise',1),H('Valeur historique USD',1),H('Au taux de clôture USD',1),H('Écart USD',1),H('Nature')],tr,['TOTAL gains / pertes','','','','','',fmtN(g,'USD')+' / '+fmtN(p,'USD'),'']):'<div class="card flat"><div class="muted">'+(num(P.cloture)>0?'Aucun écart de change à constater.':'Aucun écart réalisé. Renseignez le taux de clôture pour calculer les écarts latents des soldes encore ouverts en devise.')+'</div></div>')+

};

/* ================= Liasse - projet à valider (notes annexes, flux indirect) ================= */
function tftData(){
  const Y=S.settings.exercice,from=Y+'-01-01',to=Y+'-12-31';
  const open=balance(lines({from,to:from,noCL:true}).filter(l=>l.e.journal==='AN')),close=balance(lines({from:cumulFrom(),to,noCL:true}));
  const sd=(b,p)=>b.filter(o=>p.some(x=>o.c.startsWith(x))).reduce((s,o)=>s+o.d-o.k,0);
  const R=resultat(close).res;
  const dot=sd(close,['68','69']),rep=-sd(close,['78','79']),vnc=sd(close,['81']),pc=-sd(close,['82']);
  const caf=R+dot-rep+vnc-pc;
  const stkO=sd(open,['3']),stkC=sd(close,['3']);
  const split=b=>{let cr=0,dt=0;for(const o of b){if(!o.c.startsWith('4')||/^(478|479)/.test(o.c))continue;const s=o.d-o.k;if(s>0)cr+=s;else dt-=s}return {cr,dt}};
  const so=split(open),sc=split(close);
  const dS=-(stkC-stkO),dC=-(sc.cr-so.cr),dD=sc.dt-so.dt;
  const A=caf+dS+dC+dD;
  const mv=[];for(const l of lines({from,to,noCL:true}))if(l.e.journal!=='AN')mv.push(l);
  const acq=mv.filter(l=>/^2/.test(l.c)&&!/^2[89]/.test(l.c)).reduce((s,l)=>s+l.d,0);
  const B=-acq+pc;
  const C=mv.filter(l=>/^(10|14|16|17)/.test(l.c)).reduce((s,l)=>s+l.k-l.d,0);
  const tr=['52','53','57'],tO=sd(open,tr),tC=sd(close,tr),real=tC-tO,theo=A+B+C;
  return {R,dot,rep,vnc,pc,caf,dS,dC,dD,A,acq,B,C,tO,tC,real,theo,diff:r2(real-theo)};
}
function viewTft(){
  const T=tftData(),dev=S.aff,f=x=>fmtN(x,dev),sg=(l,x)=>['<b>'+esc(l)+'</b>','<b>'+f(x)+'</b>'],ln=(l,x)=>[esc(l),f(x)];
  const rows=[sg('Trésorerie nette à l’ouverture',T.tO),{grp:'A. Activités d’exploitation'},ln('Résultat net',T.R),ln('+ Dotations aux amortissements et provisions',T.dot),ln('− Reprises',-T.rep),ln('+ Valeurs comptables des cessions',T.vnc),ln('− Produits des cessions',-T.pc),sg('Capacité d’autofinancement globale',T.caf),
   ln('Variation des stocks',T.dS),ln('Variation des créances',T.dC),ln('Variation des dettes circulantes',T.dD),sg('Flux de trésorerie d’exploitation (A)',T.A),
   {grp:'B. Activités d’investissement'},ln('Acquisitions d’immobilisations',-T.acq),ln('Produits des cessions',T.pc),sg('Flux d’investissement (B)',T.B),
   {grp:'C. Activités de financement'},ln('Capital, subventions et emprunts (variation nette)',T.C),sg('Flux de financement (C)',T.C),
   sg('Variation de trésorerie (A + B + C)',T.theo),sg('Trésorerie nette à la clôture',T.tO+T.theo)];
  const tol=dev==='CDF'?1:0.01;
  return tbl('Tableau des flux de trésorerie - méthode indirecte (projet)',[H('Rubrique'),H('Montant',1)],rows)+
   `<div class="alert ${Math.abs(T.diff)<tol?'g':'w'}">${Math.abs(T.diff)<tol?'La variation calculée correspond à la variation réelle des comptes 52, 53 et 57.':'Écart avec la variation réelle de trésorerie ('+f(T.real)+') : '+f(T.diff)+'. À analyser avec votre comptable (comptes de tiers à classer entre investissement et financement, dividendes, écarts de change...).'}</div>`;
}
const NOTES=[['n_meth','Règles et méthodes comptables appliquées'],['n_eng','Engagements financiers et hors bilan'],['n_sur','Dettes garanties par des sûretés réelles'],['n_cap','Capital, associés ou actionnaires'],['n_prov','Provisions et dépréciations'],['n_par','Parties liées'],['n_evt','Événements postérieurs à la clôture'],['n_aut','Autres informations']];
function noteImmos(){
  const Y=S.settings.exercice,tx=num(S.settings.taux)||1,dev=S.aff,cv=(x,d)=>conv(x,d,tx,dev),T=[0,0,0,0,0,0,0,0];
  const rows=S.immos.map(im=>{
    const v=cv(num(im.valeur),im.devise),ay=+im.date.slice(0,4),cy=im.cession?+im.cession.date.slice(0,4):0;
    const y=immoYear(im,Y),yp=Y>ay?immoYear(im,Y-1):{cumul:0};
    const gone=cy&&cy<Y,out=cy===Y;
    const bd=ay<Y&&!gone?v:0,acq=ay===Y?v:0,ces=out?v:0,bf=gone||out?0:v;
    const ad=gone?0:cv(yp.cumul||0,im.devise),dot=gone?0:cv(y.dot,im.devise),rc=out?cv(y.cumul,im.devise):0,af=gone||out?0:cv(y.cumul,im.devise);
    const r=[bd,acq,ces,bf,ad,dot,rc,af];r.forEach((x,i)=>T[i]+=x);
    return [esc(im.lib),...r.map(x=>fmtN(x,dev)),fmtN(bf-af,dev)];
  });
  if(!rows.length)return '<div class="card flat"><div class="muted">Aucune immobilisation enregistrée.</div></div>';
  return tbl('Note - Immobilisations et amortissements',[H('Bien'),H('Brut début',1),H('Acquisitions',1),H('Cessions',1),H('Brut fin',1),H('Amort. début',1),H('Dotations',1),H('Reprises cessions',1),H('Amort. fin',1),H('VNC',1)],rows,['TOTAL',...T.map(x=>fmtN(x,dev)),fmtN(T[3]-T[7],dev)]);
}
function notesAutoViews(){
  const dev=S.aff,Y=S.settings.exercice,out=[];
  out.push(noteImmos());
  const C=stockCalc(Y+'-12-31');
  if(S.stocks.articles.length)out.push(tbl('Note - Stocks',[H('Article'),H('Compte'),H('Quantité',1),H('Valeur (USD)',1)],S.stocks.articles.map(a=>[esc(a.lib),esc(a.compte),fmtN0(C[a.id].qty),fmtN(C[a.id].val,'USD')])));
  const close=balance(lines({from:cumulFrom(),to:Y+'-12-31',noCL:true})),sd=(p)=>close.filter(o=>p.some(x=>o.c.startsWith(x))).reduce((s,o)=>s+o.d-o.k,0);
  const bt=balance(lines({from:cumulFrom(),to:Y+'-12-31',noCL:true}).filter(l=>l.t),true).filter(o=>Math.abs(o.d-o.k)>=0.005);
  if(bt.length)out.push(tbl('Note - Créances et dettes par tiers',[H('Compte'),H('Tiers'),H('Solde',1)],bt.map(o=>[esc(o.c),esc(tiersNom(o.t)),fmtN(o.d-o.k,dev)])));
  out.push(tbl('Note - Personnel',[H('Rubrique'),H('Montant',1)],[['Effectif enregistré',String(S.paie?S.paie.employes.filter(e=>e.actif!==false).length:0)],['Rémunérations (66x hors charges sociales)',fmtN(sd(['66'])-sd(['664']),dev)],['Charges sociales (664)',fmtN(sd(['664']),dev)]]));
  out.push(tbl('Note - Capitaux propres',[H('Rubrique'),H('Montant',1)],[['Capital (10x)',fmtN(-sd(['10']),dev)],['Réserves (11x)',fmtN(-sd(['11']),dev)],['Report à nouveau (12x)',fmtN(-sd(['12']),dev)],['Emprunts et dettes financières (16x, 17x)',fmtN(-sd(['16','17']),dev)]]));
  return out.join('');
}

const PV={orient:'P',zoom:1,mode:'fit',pages:[],cur:0,open:false};
const PV_SZ=()=>PV.orient==='P'?{w:794,h:1123}:{w:1123,h:794};
const PV_PAD={x:48,t:34,b:30};
function pvClean(root){
  root.querySelectorAll('.crumb,.noprint,.btn,.pills,.row.noprint,script,datalist,.banner').forEach(e=>e.remove());
  root.querySelectorAll('input,select,textarea').forEach(e=>{
    let t='';
    if(e.tagName==='SELECT')t=e.options[e.selectedIndex]?e.options[e.selectedIndex].text:'';else t=e.value||'';
    if(e.type==='checkbox'){t=e.checked?'☑':'☐'}
    const s=document.createElement('span');s.textContent=t;e.replaceWith(s);
  });
  root.querySelectorAll('.phead').forEach(e=>{e.style.display='block'});
}
function pvCollect(root){
  const out=[];
  (function walk(n){for(const c of Array.from(n.children)){
    if(c.tagName==='TABLE')out.push({t:'table',el:c});
    else if(c.querySelector('table'))walk(c);
    else out.push({t:'blk',el:c});
  }})(root);
  return out;
}
function pvShell(i,n){
  const sz=PV_SZ(),now=new Date();
  const p=document.createElement('div');p.className='pv-page';p.style.width=sz.w+'px';p.style.height=sz.h+'px';
  p.innerHTML=`<div class="pv-run"><span>${esc(S.settings.nom||'')}</span><span>Édité le ${fdate(iso(now))} à ${z2(now.getHours())}:${z2(now.getMinutes())}</span></div><div class="pv-body"></div><div class="pv-foot"><span>NIA Compta${S.user?' · '+esc(S.user.nom):''}</span><span>Page ${i} / ${n}</span></div>`;
  return p;
}
function pvBuild(){
  const sz=PV_SZ(),src=document.getElementById('app'),clone=src.cloneNode(true);
  pvClean(clone);
  const atoms=pvCollect(clone);
  const probe=pvShell(1,1);probe.style.visibility='hidden';probe.style.position='absolute';document.body.appendChild(probe);
  const body=probe.querySelector('.pv-body'),H=body.clientHeight,W=body.clientWidth;
  const mw=document.createElement('div');mw.className='pv-page pv-measw';mw.style.cssText='position:absolute;visibility:hidden;left:-9999px;top:0;height:auto;padding:0;width:'+W+'px;display:block;overflow:visible;box-shadow:none';
  const meas=document.createElement('div');meas.className='pv-body';meas.style.cssText='overflow:visible;height:auto;width:'+W+'px';mw.appendChild(meas);document.body.appendChild(mw);
  const h=el=>{meas.innerHTML='';meas.appendChild(el);const r=el.getBoundingClientRect().height;const cs=getComputedStyle(el);return r+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0)+4};
  const pages=[[]];let used=0;
  const push=(el,ht)=>{if(used+ht>H&&used>0){pages.push([]);used=0}pages[pages.length-1].push(el);used+=ht};
  for(const a of atoms){
    if(a.t==='blk'){const c=a.el.cloneNode(true);push(c,h(a.el.cloneNode(true)));continue}
    const t=a.el,head=t.tHead,rows=Array.from(t.rows).filter(r=>!head||r.parentNode!==head);
    meas.innerHTML='';const full=t.cloneNode(true);meas.appendChild(full);
    const hh=full.tHead?full.tHead.getBoundingClientRect().height:0;
    const rh=Array.from(full.rows).filter(r=>!full.tHead||r.parentNode!==full.tHead).map(r=>r.getBoundingClientRect().height);
    const mk=()=>{const nt=t.cloneNode(false);nt.className=t.className;if(head)nt.appendChild(head.cloneNode(true));const tb=document.createElement('tbody');nt.appendChild(tb);return {nt,tb}};
    let cur=null;
    rows.forEach((r,i)=>{
      const need=(cur?0:hh+4)+rh[i];
      if(!cur||used+rh[i]>H){
        if(cur&&used+rh[i]>H){pages.push([]);used=0;cur=null}
        else if(!cur&&used+hh+rh[i]>H&&used>0){pages.push([]);used=0}
        if(!cur){cur=mk();pages[pages.length-1].push(cur.nt);used+=hh+4}
      }
      cur.tb.appendChild(r.cloneNode(true));used+=rh[i];
    });
  }
  probe.remove();mw.remove();
  const n=pages.length;
  PV.pages=pages.map((els,i)=>{const p=pvShell(i+1,n);const b=p.querySelector('.pv-body');els.forEach(e=>b.appendChild(e));return p});
}
function pvRender(){
  const box=document.getElementById('pv-pages');box.innerHTML='';PV.pages.forEach(p=>box.appendChild(p));
  pvApplyZoom();pvInfo();
  let st=document.getElementById('pv-pagestyle');if(!st){st=document.createElement('style');st.id='pv-pagestyle';document.head.appendChild(st)}
  st.textContent='@page{size:A4 '+(PV.orient==='P'?'portrait':'landscape')+';margin:0}';
}
function pvApplyZoom(){
  const sc=document.getElementById('pv-scroll'),sz=PV_SZ();let z=PV.zoom;
  if(PV.mode==='fit')z=Math.min(1,Math.max(.3,(sc.clientWidth-48)/sz.w||1));
  else if(PV.mode==='page')z=Math.min(1,Math.max(.3,Math.min((sc.clientWidth-48)/sz.w,(sc.clientHeight-32)/sz.h)||1));
  PV.zoom=z;document.getElementById('pv-pages').style.zoom=z;
  const l=document.getElementById('pv-zl');if(l)l.textContent=Math.round(z*100)+' %';
}
function pvInfo(){const l=document.getElementById('pv-pn');if(l)l.textContent='Page '+(PV.cur+1)+' / '+PV.pages.length}
function pvGo(i){
  PV.cur=Math.max(0,Math.min(PV.pages.length-1,i));const sc=document.getElementById('pv-scroll'),p=PV.pages[PV.cur];
  if(sc&&p)sc.scrollTop=p.offsetTop*PV.zoom-16;pvInfo();
}
function pvOpen(){
  let el=document.getElementById('pv');
  if(!el){
    el=document.createElement('div');el.id='pv';el.className='pv';
    el.innerHTML=`<div class="pv-bar"><button class="btn primary" data-act="pvprint" id="pv-print">Imprimer</button><span class="tsep"></span>
     <button class="btn" data-act="pvgo" data-v="-1" title="Page précédente">◀</button><span id="pv-pn" class="pv-lbl"></span><button class="btn" data-act="pvgo" data-v="1" title="Page suivante">▶</button><span class="tsep"></span>
     <button class="btn" data-act="pvzoom" data-v="-1" title="Zoom arrière">−</button><span id="pv-zl" class="pv-lbl"></span><button class="btn" data-act="pvzoom" data-v="1" title="Zoom avant">+</button>
     <button class="btn" data-act="pvfit" data-v="fit">Pleine largeur</button><button class="btn" data-act="pvfit" data-v="page">Page entière</button><span class="tsep"></span>
     <button class="btn" data-act="pvorient" data-v="P" id="pv-op">Portrait</button><button class="btn" data-act="pvorient" data-v="L" id="pv-ol">Paysage</button>
     <span style="flex:1"></span><button class="btn" data-act="pvclose" id="pv-close">Fermer</button></div>
     <div id="pv-scroll" class="pv-scroll"><div id="pv-pages" class="pv-pages"></div></div>`;
    document.body.appendChild(el);
    document.getElementById('pv-scroll').addEventListener('scroll',()=>{
      const sc=document.getElementById('pv-scroll');let c=0;
      PV.pages.forEach((p,i)=>{if(p.offsetTop*PV.zoom-sc.scrollTop<sc.clientHeight/2)c=i});
      if(c!==PV.cur){PV.cur=c;pvInfo()}
    });
  }
  PV.open=true;PV.cur=0;PV.mode='fit';
  el.style.display='flex';document.body.classList.add('pv-open');
  pvBuild();pvRender();pvOrientBtns();
  document.getElementById('pv-scroll').scrollTop=0;
}
function pvOrientBtns(){
  const p=document.getElementById('pv-op'),l=document.getElementById('pv-ol');
  if(p)p.classList.toggle('primary',PV.orient==='P');if(l)l.classList.toggle('primary',PV.orient==='L');
}
function pvClose(){PV.open=false;const el=document.getElementById('pv');if(el)el.style.display='none';document.body.classList.remove('pv-open')}
ACT.print=()=>{if(S.user===null&&S.auth&&S.auth.state!=='ok')return;pvOpen()};
ACT.pvclose=()=>pvClose();
ACT.pvprint=()=>{window.print()};
ACT.pvgo=t=>pvGo(PV.cur+(+t.dataset.v));
ACT.pvzoom=t=>{PV.mode='free';PV.zoom=Math.max(.3,Math.min(2,PV.zoom+(+t.dataset.v)*.1));pvApplyZoom()};
ACT.pvfit=t=>{PV.mode=t.dataset.v;pvApplyZoom()};
ACT.pvorient=t=>{PV.orient=t.dataset.v;pvBuild();pvRender();pvOrientBtns();pvGo(0)};
document.addEventListener('keydown',ev=>{
  if(!PV.open)return;
  if(ev.key==='Escape'){ev.stopImmediatePropagation();pvClose()}

const REPS=[['journal','Journal'],['gl','Grand livre'],['glaux','Grand livre aux.'],['balance','Balance'],['balaux','Balance aux.'],['agee','Balance âgée'],['res','Résultat'],['bilan','Bilan']];
const dN=(d,k)=>d?fmtN(d,S.aff):'',kN=(k)=>k?fmtN(k,S.aff):'';
function reportBefore(filterFn){
  const m=new Map();
  if(!S.du)return m;
  for(const l of lines({from:cumulFrom(),to:addDays(S.du,-1)}).filter(filterFn)){m.set(l.c,(m.get(l.c)||0)+l.d-l.k)}
  return m;
}
VIEWS.etat=function(){
  const r=S.rep,dev=S.aff,title=(REPS.find(x=>x[0]===r)||[0,'État'])[1];
  let body='';
  if(r==='journal'){
    const es=entries().filter(e=>e.date>=S.du&&e.date<=S.au).sort((a,b)=>a.journal.localeCompare(b.journal)||a.date.localeCompare(b.date)||String(a.piece).localeCompare(String(b.piece)));
    const rows=[];let TD=0,TK=0,cur='';
    for(const e of es){
      if(e.journal!==cur){cur=e.journal;rows.push({grp:'Journal '+esc(cur)+' · '+esc((JOURNAUX.find(j=>j[0]===cur)||[0,''])[1])})}
      const t=e.taux||S.settings.taux||1;
      for(const l of e.lignes){const d=conv(num(l.d),e.devise,t,dev),k=conv(num(l.k),e.devise,t,dev);TD+=d;TK+=k;
        rows.push([fdate(e.date),esc(e.piece),accCell(l.c),esc(l.t?tiersNom(l.t):''),esc(l.lib||e.libelle),dN(d),kN(k)])}
    }
    body=tbl('Journal',[H('Date'),H('Pièce'),H('Compte'),H('Tiers'),H('Libellé'),H('Débit',1),H('Crédit',1)],rows,['','','','','Totaux',fmtN(TD,dev),fmtN(TK,dev)]);
  }else if(r==='gl'){
    const ls=lines(),ac=[...new Set(ls.map(l=>l.c))],rep=reportBefore(()=>true);
    rep.forEach((v,c)=>{if(!ac.includes(c)&&Math.abs(v)>0.004)ac.push(c)});ac.sort((a,b)=>a.localeCompare(b,'fr',{numeric:true}));
    if(S.gl!=='ALL'&&!ac.includes(S.gl))S.gl=ac[0]||'ALL';
    const sel=S.gl==='ALL'?ac:[S.gl],rows=[];
    for(const c of sel){
      if(S.gl==='ALL')rows.push({grp:accCell(c)});
      let run=rep.get(c)||0,D=0,K=0;

      for(const l of ls.filter(x=>x.c===c).sort((a,b)=>a.e.date.localeCompare(b.e.date)||String(a.e.piece).localeCompare(String(b.e.piece)))){
        run+=l.d-l.k;D+=l.d;K+=l.k;rows.push([fdate(l.e.date),esc(l.e.piece),esc(l.lib||l.e.libelle),esc(l.t?tiersNom(l.t):''),dN(l.d),kN(l.k),fmtN(run,dev)])}
      if(S.gl==='ALL')rows.push(['','','<b>Total '+esc(c)+'</b>','','<b>'+fmtN(D,dev)+'</b>','<b>'+fmtN(K,dev)+'</b>','<b>'+fmtN(run,dev)+'</b>']);
    }

      tbl('Grand livre',[H('Date'),H('Pièce'),H('Libellé'),H('Tiers'),H('Débit',1),H('Crédit',1),H('Solde',1)],rows);
  }else if(r==='glaux'){
    const T=S.tiers.slice().sort((a,b)=>a.code.localeCompare(b.code,'fr',{numeric:true}));
    if(!S.glT||!tiersOf(S.glT))S.glT=T[0]?T[0].code:'';
    const rep=reportBefore(l=>l.t===S.glT);let run=0;rep.forEach(v=>run+=v);
    const rows=[];if(Math.abs(run)>0.004)rows.push(['','','','Report','',run>0?fmtN(run,dev):'',run<0?fmtN(-run,dev):'',fmtN(run,dev)]);
    let D=0,K=0;
    for(const l of lines().filter(x=>x.t===S.glT).sort((a,b)=>a.e.date.localeCompare(b.e.date))){run+=l.d-l.k;D+=l.d;K+=l.k;
      rows.push([fdate(l.e.date),esc(l.e.piece),esc(l.c),esc(l.lib||l.e.libelle),`<span class="lt">${esc(l.lt)}</span>`,dN(l.d),kN(l.k),fmtN(run,dev)])}
    body=`<label class="noprint">Tiers<select id="gla-t" data-b="glT" data-rr="1">${T.map(t=>`<option value="${esc(t.code)}" ${t.code===S.glT?'selected':''}>${esc(t.nom)} (${esc(t.code)})</option>`).join('')||'<option value="">Aucun tiers</option>'}</select></label>`+
      tbl('Grand livre auxiliaire '+tiersNom(S.glT),[H('Date'),H('Pièce'),H('Compte'),H('Libellé'),H('Lettre'),H('Débit',1),H('Crédit',1),H('Solde',1)],rows,['','','','','Totaux',fmtN(D,dev),fmtN(K,dev),fmtN(run,dev)]);
  }else if(r==='balance'){
    const bal=balance(lines({noCL:true}));let D=0,K=0,SD=0,SK=0;
    const rows=bal.map(o=>{const s=o.d-o.k;D+=o.d;K+=o.k;if(s>0)SD+=s;else SK-=s;return [esc(o.c),esc(accName(o.c)),fmtN(o.d,dev),fmtN(o.k,dev),s>0?fmtN(s,dev):'',s<0?fmtN(-s,dev):'']});
    body=tbl('Balance générale',[H('Compte'),H('Intitulé'),H('Mouvements débit',1),H('Mouvements crédit',1),H('Solde débiteur',1),H('Solde créditeur',1)],rows,['','Totaux',fmtN(D,dev),fmtN(K,dev),fmtN(SD,dev),fmtN(SK,dev)])+
      `<div class="alert ${Math.abs(D-K)<(dev==='CDF'?1:0.01)?'g':'b'}">${Math.abs(D-K)<(dev==='CDF'?1:0.01)?'La balance est équilibrée.':'Écart débit − crédit : '+fmtN(D-K,dev)+'.'}</div><p class="small muted" style="margin:0">Cette balance n’inclut pas l’écriture de clôture (journal CL).</p>`;
  }else if(r==='balaux'){
    const bal=balance(lines({noCL:true}),true).filter(o=>o.t);let D=0,K=0,SD=0,SK=0;
    const rows=bal.map(o=>{const s=o.d-o.k;D+=o.d;K+=o.k;if(s>0)SD+=s;else SK-=s;return [esc(o.t),esc(tiersNom(o.t)),esc(o.c),fmtN(o.d,dev),fmtN(o.k,dev),s>0?fmtN(s,dev):'',s<0?fmtN(-s,dev):'']});
    body=tbl('Balance auxiliaire',[H('Tiers'),H('Nom'),H('Compte'),H('Débit',1),H('Crédit',1),H('Solde débiteur',1),H('Solde créditeur',1)],rows,['','Totaux','',fmtN(D,dev),fmtN(K,dev),fmtN(SD,dev),fmtN(SK,dev)]);
  }else if(r==='agee'){
    const ref=S.au,B=['Non échu','1 à 30 j','31 à 60 j','61 à 90 j','Plus de 90 j'],byT=new Map();
    const bk=n=>n<=0?0:n<=30?1:n<=60?2:n<=90?3:4;
    for(const l of lines({from:cumulFrom(),noCL:true,cur:dev})){
      const t=tiersOf(l.t);if(!t||t.type!==S.ba||l.lt)continue;
      if(!String(l.c).startsWith('4'))continue;
      let ech=l.e.date;if(l.e.src&&l.e.src[0]==='F'){const f=S.factures.find(x=>x.id===l.e.src.slice(2));if(f&&f.echeance)ech=f.echeance}
      const amt=S.ba==='C'?l.d-l.k:l.k-l.d;
      const o=byT.get(l.t)||[0,0,0,0,0];o[bk(diffDays(ref,ech))]+=amt;byT.set(l.t,o);
    }
    const tot=[0,0,0,0,0];
    const rows=[...byT.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([c,o])=>{o.forEach((v,i)=>tot[i]+=v);return [esc(c),esc(tiersNom(c)),...o.map(v=>fmtN(v,dev)),fmtN(o.reduce((s,v)=>s+v,0),dev)]});
    body=`<div class="pills noprint"><button class="pill" data-act="baset" data-v="C" aria-pressed="${S.ba==='C'}">Clients</button><button class="pill" data-act="baset" data-v="F" aria-pressed="${S.ba==='F'}">Fournisseurs</button></div>`+
      tbl('Balance âgée '+(S.ba==='C'?'clients':'fournisseurs'),[H('Code'),H('Tiers'),...B.map(b=>H(b,1)),H('Total',1)],rows,['','Totaux',...tot.map(v=>fmtN(v,dev)),fmtN(tot.reduce((s,v)=>s+v,0),dev)])+
      `<p class="small muted" style="margin:0">Situation au ${fdate(ref)}, calculée sur les lignes de tiers non lettrées, par ancienneté depuis l’échéance (ou la date de l’écriture sans facture). Pensez à lettrer les règlements saisis à la main.</p>`;
  }else if(r==='res'){
    const R=resultat(balance(lines({noCL:true})));
    const t=a=>a.map(o=>[accCell(o.c),fmtN(o.v,dev)]);
    body=tbl('Produits',[H('Produits'),H('Montant',1)],t(R.P),['Total produits',fmtN(R.prod,dev)])+tbl('Charges',[H('Charges'),H('Montant',1)],t(R.C),['Total charges',fmtN(R.chg,dev)])+
      `<div class="kpi main"><div class="l">${R.res>=0?'Bénéfice':'Perte'} de la période</div><div class="v ${R.res>=0?'pos':'neg'}">${money(R.res,dev)}</div></div>`;
  }else{
    const all=balance(lines({from:cumulFrom(),noCL:true})),R=resultat(all);
    const A=[],P=[];let ta=0,tp=0;
    for(const o of all){
      const s=o.d-o.k,cl=o.c[0];
      if(cl==='1'){P.push([accCell(o.c),fmtN(-s,dev)]);tp+=-s}
      else if('2345'.includes(cl)){
        if(CONTRA.some(p=>o.c.startsWith(p))||s>=0){A.push([accCell(o.c),fmtN(s,dev)]);ta+=s}
        else{P.push([accCell(o.c),fmtN(-s,dev)]);tp+=-s}
      }
    }
    P.push([R.res>=0?'Résultat de l’exercice (bénéfice)':'Résultat de l’exercice (perte)',fmtN(R.res,dev)]);tp+=R.res;
    const diff=r2(ta-tp),tol=dev==='CDF'?1:0.01;
    body=`<p class="small muted" style="margin:0">Cumul jusqu’au ${fdate(S.au)}.</p>`+tbl('Actif',[H('Actif'),H('Montant',1)],A,['Total actif',fmtN(ta,dev)])+tbl('Passif',[H('Passif'),H('Montant',1)],P,['Total passif',fmtN(tp,dev)])+
      `<div class="alert ${Math.abs(diff)<tol?'g':'b'}">${Math.abs(diff)<tol?'Le bilan est équilibré.':'Écart actif − passif : '+fmtN(diff,dev)+'. Il vient souvent d’arrondis de conversion entre USD et CDF.'}</div>`;
  }
  return pageHead(title,'Rapports','<button class="btn" data-act="print">Imprimer</button><button class="btn" data-act="csv">Exporter (CSV)</button>')+demoBanner()+periodBar()+
   `<div class="card"><div class="pills noprint">${REPS.map(x=>`<button class="pill" data-act="rep" data-v="${x[0]}" aria-pressed="${S.rep===x[0]}">${x[1]}</button>`).join('')}</div>${printHead(title)}${body}</div>`;
};

const notT=l=>!(l.e.src&&l.e.src[0]==='T');
function tvaFor(from,to){
  const ls=lines({from,to,noCL:true}).filter(notT);let col=0,rec=0;
  for(const l of ls){if(l.c.startsWith('443'))col+=l.k-l.d;else if(l.c.startsWith('445'))rec+=l.d-l.k}
  return {col,rec,due:col-rec};
}
VIEWS.tva=function(){
  const dev=S.aff,Y=S.settings.exercice,cur=tvaFor(S.du,S.au),rows=[];let C=0,R=0;
  for(let m=1;m<=12;m++){const a=Y+'-'+z2(m)+'-01',b=Y+'-'+z2(m)+'-'+z2(new Date(Y,m,0).getDate()),t=tvaFor(a,b);C+=t.col;R+=t.rec;
    rows.push([MOIS[m-1],fmtN(t.col,dev),fmtN(t.rec,dev),fmtN(t.due,dev)])}
  const done=S.entries.find(e=>e.src==='T:'+S.du+'..'+S.au);
  return pageHead('Déclaration de TVA','Traitement › TVA','<button class="btn" data-act="print">Imprimer</button>')+demoBanner()+periodBar()+
  `<div class="kpis"><div class="kpi"><div class="l">TVA facturée</div><div class="v">${money(cur.col,dev)}</div></div><div class="kpi"><div class="l">TVA récupérable</div><div class="v">${money(cur.rec,dev)}</div></div><div class="kpi main"><div class="l">${cur.due>=0?'TVA à reverser':'Crédit de TVA'}</div><div class="v ${cur.due>=0?'':'pos'}">${money(Math.abs(cur.due),dev)}</div></div></div>
  <div class="card">${printHead('Déclaration de TVA')}<h3>Situation mensuelle ${Y}</h3>${tbl('TVA mensuelle '+Y,[H('Mois'),H('TVA facturée',1),H('TVA récupérable',1),H('Solde',1)],rows,['Total',fmtN(C,dev),fmtN(R,dev),fmtN(C-R,dev)])}
  <p class="small muted" style="margin:0">TVA facturée : comptes 443. TVA récupérable : comptes 445. Aucun taux n’est prérempli : il se règle dans Réglages. Vérifiez les règles et les échéances auprès de la DGI.</p></div>
  <div class="card noprint"><h3>Écriture de liquidation</h3><p class="small muted" style="margin:0">Solde les comptes de TVA de la période affichée : la TVA facturée est soldée contre la TVA récupérable, et le reste à payer va au compte 4441 État, TVA due. En cas de crédit, il reste en 4452 pour la période suivante.</p>
  <div class="row"><button class="btn primary" data-act="tvagen" ${(cur.col<=0.004)?'disabled':''}>${done?'Régénérer':'Générer'} l’écriture de liquidation</button>${done?'<span class="small pos">Déjà générée pour cette période.</span>':''}</div></div>`;
};
async function genTVA(){
  const c=tvaFor(S.du,S.au);if(c.col<=0.004){toast('Aucune TVA facturée sur la période.');return}
  if(locked(S.au)){toast('Exercice clôturé.');return}
  const id='tva-'+S.du+'..'+S.au;dropEntry(id);
  const col=r2(c.col),use=r2(Math.min(col,Math.max(c.rec,0))),L=[{c:'4431',d:col,k:0}];
  if(use>0)L.push({c:'4452',d:0,k:use});
  if(col-use>0.004)L.push({c:'4441',d:0,k:r2(col-use)});
  putEntry({id,date:S.au,journal:'OD',piece:nextPiece('OD'),libelle:'Liquidation de la TVA du '+fdate(S.du)+' au '+fdate(S.au),devise:S.aff,taux:num(S.settings.taux)||1,src:'T:'+S.du+'..'+S.au,lignes:L});
  S.settings.started=true;await commit('Écriture de liquidation générée.');
}

  let unl=0;for(const l of lines({from:Y+'-01-01',to:Y+'-12-31',noCL:true}))if(l.t&&!l.lt)unl++;
  const tvaDone=S.entries.some(e=>e.src&&e.src[0]==='T'&&e.date.slice(0,4)===String(Y));
  const chk=(ok,t,h)=>`<div class="alert ${ok?'g':'w'}"><div><b>${ok?'OK':'À vérifier'}</b> · ${t}${h?`<div class="small muted">${h}</div>`:''}</div></div>`;

  <div class="card"><h3>Contrôles avant clôture</h3>
   ${chk(n>0,n+' écriture'+(n>1?'s':'')+' sur l’exercice')}
   ${chk(missDot===0,missDot?missDot+' immobilisation'+(missDot>1?'s':'')+' sans dotation générée':'Dotations aux amortissements à jour',missDot?'Allez dans Immobilisations puis générez les dotations.':'')}
   ${chk(unl===0,unl?unl+' ligne'+(unl>1?'s':'')+' de tiers non lettrée'+(unl>1?'s':''):'Toutes les lignes de tiers sont lettrées',unl?'Ce n’est pas bloquant : les soldes ouverts sont reportés par tiers.':'')}
   ${chk(tvaDone,tvaDone?'Une liquidation de TVA existe sur l’exercice':'Aucune liquidation de TVA générée',tvaDone?'':'Vérifiez dans Déclaration de TVA si elle est nécessaire.')}</div>
  <div class="card"><h3>Ce que fait la clôture</h3><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>Solde les comptes de charges et de produits dans une écriture du journal CL, et inscrit le résultat en 131 (bénéfice) ou 139 (perte).</li><li>Crée les à-nouveaux de ${Y+1} (journal AN) avec les soldes des comptes de bilan, tiers par tiers.</li><li>Verrouille ${Y} : plus aucune saisie, modification ou suppression possible sur cet exercice.</li><li>Passe l’affichage sur l’exercice ${Y+1}.</li></ol>
   <p class="small muted" style="margin:0">Faites une sauvegarde complète avant de clôturer. L’affectation du résultat se fait ensuite par une écriture de votre choix.</p>
   <div class="row">${closed?(S.confirm==='reopen'?'<button class="btn danger" data-act="rouvrir">Confirmer la réouverture</button><button class="btn" data-act="nodel">Annuler</button>':'<button class="btn danger" data-act="askreopen">Rouvrir l’exercice '+Y+'</button>'):(S.confirm==='close'?'<button class="btn primary" data-act="clot">Confirmer la clôture de '+Y+'</button><button class="btn" data-act="nodel">Annuler</button>':'<button class="btn primary" data-act="askclose" '+(n?'':'disabled')+'>Clôturer l’exercice '+Y+'</button>')}<button class="btn" data-act="json">Sauvegarde complète</button></div></div>`;
};
async function doCloture(){
  const Y=S.settings.exercice,cl='cl-'+Y,an='an-'+(Y+1);
  S.entries=S.entries.filter(e=>e.id!==cl&&e.id!==an);
  const from=cumulFrom();
  const bal=balance(lines({from:Y+'-01-01',to:Y+'-12-31',cur:'USD',noCL:true}));
  const L=[];let D=0,K=0;
  for(const o of bal){
    if(!'678'.includes(o.c[0]))continue;
    const s=r2(o.d-o.k);if(Math.abs(s)<0.005)continue;
    if(s>0){L.push({c:o.c,d:0,k:s});K+=s}else{L.push({c:o.c,d:-s,k:0});D+=-s}
  }
  D=r2(D);K=r2(K);
  if(D>K)L.push({c:'131',d:0,k:r2(D-K)});else if(K>D)L.push({c:'139',d:r2(K-D),k:0});
  const taux=num(S.settings.taux)||1;
  if(L.length)putEntry({id:cl,date:Y+'-12-31',journal:'CL',piece:'CL-'+Y,libelle:'Écriture de clôture '+Y,devise:'USD',taux,src:'C:'+Y,lignes:L});
  const ls=lines({from,to:Y+'-12-31',cur:'USD'}).filter(l=>'12345'.includes(l.c[0]));
  const A=[];let ad=0,ak=0;
  for(const o of balance(ls,true)){
    const s=r2(o.d-o.k);if(s===0)continue;
    const l={c:o.c,d:s>0?s:0,k:s<0?-s:0};if(o.t)l.t=o.t;A.push(l);ad+=l.d;ak+=l.k;
  }
  const diff=r2(ad-ak);
  if(A.length&&Math.abs(diff)>=0.005){const big=A.reduce((m,l)=>Math.max(l.d,l.k)>Math.max(m.d,m.k)?l:m,A[0]);if(diff>0){if(big.k>0)big.k=r2(big.k+diff);else big.d=r2(big.d-diff)}else{if(big.d>0)big.d=r2(big.d-diff);else big.k=r2(big.k+diff)}}
  if(A.length)putEntry({id:an,date:(Y+1)+'-01-01',journal:'AN',piece:'AN-'+(Y+1),libelle:'À nouveaux '+(Y+1)+' (report des soldes)',devise:'USD',taux,src:'A:'+(Y+1),lignes:A});
  S.settings.clotures[Y]=true;S.settings.exercice=Y+1;S.settings.started=true;
  S.periodSet=false;S.mois='ex';S.du=(Y+1)+'-01-01';S.au=(Y+1)+'-12-31';S.draft=newDraft();S.confirm=null;
  await commit('Exercice '+Y+' clôturé. Les à-nouveaux '+(Y+1)+' sont générés.');
}
async function doRouvrir(){
  const Y=S.settings.exercice;
  if(S.settings.clotures[Y+1]){toast('Rouvrez d’abord l’exercice '+(Y+1)+'.');S.confirm=null;rerender(true);return}
  S.entries=S.entries.filter(e=>e.id!=='cl-'+Y&&e.id!=='an-'+(Y+1)&&e.id!=='fxe-'+Y);
  delete S.settings.clotures[Y];S.confirm=null;
  await commit('Exercice '+Y+' rouvert. Les écritures de clôture et d’à-nouveaux ont été supprimées.');
}

VIEWS.aide=function(){
