  <h3>Premiers pas</h3><ol><li>Réglages : nom de la société, exercice, taux de change du jour, taux de TVA en vigueur.</li><li>Tiers : créez vos clients et fournisseurs.</li><li>Saisie ou Factures : enregistrez vos opérations. Chaque facture et chaque règlement génèrent leurs écritures.</li><li>Rapports : balance, grand livre, résultat, bilan, balance âgée.</li></ol>
  <h3>Saisie</h3><p>Une écriture doit être équilibrée (total débit égal au total crédit). Sur les comptes 411 et 401, indiquez le tiers pour suivre les soldes et la balance âgée. La saisie guidée remplit les lignes des opérations courantes.</p>
  <h3>Factures et règlements</h3><p>Une facture crée son écriture dans le journal VE (clients) ou AC (fournisseurs). Chaque règlement crée une écriture en caisse (571) ou en banque (521). Quand la facture est soldée, les lignes sont lettrées automatiquement. L’aperçu permet d’imprimer ou d’enregistrer en PDF, avec le montant en lettres.</p>
  <h3>Lettrage et rapprochement bancaire</h3><p>Lettrage : associe un débit et un crédit de même montant pour un tiers. Rapprochement : cochez les lignes du compte 521 retrouvées sur le relevé de la banque, jusqu’à obtenir un écart nul.</p>
  <h3>Immobilisations, TVA et clôture</h3><p>Les dotations sont linéaires, au prorata des mois. Le bouton Céder enregistre la sortie d’un bien (dotation complémentaire, valeur comptable, prix de cession) et calcule la plus ou moins-value. La liquidation de TVA solde les comptes 443 et 445 de la période. La clôture crée l’écriture de clôture et les à-nouveaux, puis verrouille l’exercice.</p>
  <h3>Dossiers</h3><p>Un dossier par société. Ouvrez-en un autre depuis le menu Dossiers.</p>
   <h3>Paie</h3><p>Renseignez d’abord les Paramètres de paie (taux de cotisations, barème de l’impôt sur les salaires, comptes) : aucun taux n’est prérempli, ils sont à reprendre des textes officiels en vigueur. Créez ensuite les employés, saisissez les éléments variables du mois, validez la paie (écriture dans le journal PA) puis enregistrez le paiement. Les bulletins sont imprimables.</p>
   <h3>États financiers</h3><p>Bilan, compte de résultat avec soldes intermédiaires de gestion et flux de trésorerie (méthode directe), calculés à partir des écritures de la période. Présentation par rubriques à valider avec votre comptable.</p>
   <h3>Import de relevé bancaire</h3><p>Collez ou ouvrez le fichier de votre banque (Excel .xlsx, CSV ou texte ; première feuille du classeur), vérifiez les colonnes, affectez les contreparties (règles par mot-clé possibles), puis importez. Les doublons sont détectés et le dernier import peut être annulé.</p>
  <h3>Raccourcis</h3><p>Ctrl+N nouvelle écriture · Ctrl+S enregistrer · Ctrl+P imprimer · F1 aide · Échap fermer une fenêtre.</p>
  <h3>Stocks et inventaire</h3><p>Créez vos articles (compte 31x, 32x ou 33x), saisissez les entrées (avec coût unitaire) et les sorties : le stock est valorisé au coût moyen pondéré. À la fin de l’exercice, l’écran Inventaire permet de saisir les quantités comptées, puis génère l’écriture de variation de stocks (603x).</p>
  <h3>Amortissement dégressif</h3><p>Dans la fiche d’une immobilisation, choisissez la méthode Dégressif et renseignez vous-même le coefficient prévu par la réglementation applicable : aucun coefficient n’est prérempli.</p>
  <h3>Utilisateurs, mot de passe et chiffrement</h3><p>Le premier lancement crée le compte administrateur et une <b>clé de secours</b> à noter (elle n’est affichée qu’une fois). Les dossiers sont chiffrés (AES-256) sur le disque : sans mot de passe ni clé de secours, les données sont irrécupérables. L’administrateur crée les autres comptes (comptable, saisie, lecture seule) dans Paramètres › Utilisateurs ; en cas de mot de passe oublié, l’écran de connexion propose la récupération par clé de secours. La sauvegarde complète peut être protégée par un mot de passe : il est indispensable pour la restaurer. Les comptes sont locaux à cet ordinateur : le logiciel n’est pas un serveur multi-utilisateurs en réseau.</p>
  <h3>Aperçu avant impression</h3><p>Le bouton Imprimer (ou Ctrl+P) ouvre un aperçu page par page : navigation entre les pages, zoom, orientation portrait ou paysage, puis impression ou enregistrement en PDF depuis l’aperçu. Échap ferme l’aperçu.</p>
  <h3>Écarts de change</h3><p>Traitement › Écarts de change : indiquez le taux de clôture (CDF pour 1 USD). Le logiciel réévalue les soldes encore ouverts en devise (écarts de conversion 478/479, extournés au 01/01) et constate les écarts réalisés et ceux de la trésorerie en pertes ou gains de change (676/776). Les comptes sont à confirmer avec votre comptable.</p>
  <h3>Liasse (projet à valider)</h3><p>États financiers › Liasse : fiche d’identification, bilan, compte de résultat, tableau des flux de trésorerie (méthode indirecte), notes annexes calculées et notes libres. C’est un projet à faire valider, pas la liasse officielle.</p>
  <h3>Ce que le logiciel ne fait pas encore</h3><ul><li>Liasse fiscale officielle : références et numéros de notes du modèle officiel, à rapprocher avec votre comptable.</li><li>Suivi en devise d’origine des soldes reportés d’un exercice à l’autre (ils sont repris en USD).</li><li>Travail simultané de plusieurs personnes sur les mêmes données, à travers un réseau.</li></ul>
  <p class="small muted">Les comptes, taux et règles fiscales sont à vérifier avec votre comptable et la réglementation en vigueur.</p></div>`;
};

/* ================= Export ================= */
const csvCell=c=>{c=String(c==null?'':c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c};
function csvJournal(){
  const rows=[['Date','Journal','Pièce','Libellé','Compte','Intitulé du compte','Tiers','Débit','Crédit','Devise','Lettre']];
  for(const e of entries().slice().sort((a,b)=>a.date.localeCompare(b.date)))for(const l of e.lignes)rows.push([e.date,e.journal,e.piece,e.libelle,l.c,accLabel(l.c),l.t||'',num(l.d)||'',num(l.k)||'',e.devise,l.lt||'']);
  return rows;
}
function exportView(){
  let rows=[];
  if(S.view==='journal'||!S.exp.length)rows=csvJournal();
  else for(const t of S.exp){rows.push([t.title]);rows.push(t.head);for(const r of t.rows)rows.push(r.map(strip));if(t.foot)rows.push(t.foot.map(strip));rows.push([])}
  const name=(S.view==='journal'||!S.exp.length?'journal':(S.view==='etat'?S.rep:S.view))+'-nia-compta.csv';
  exportFile(name,'﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\n'));
}
async function exportFile(name,data){
  try{const p=await window.nia.saveFile(name,data);if(p)toast('Fichier enregistré : '+p)}catch(e){toast('Export impossible.')}
}

/* ================= Événements ================= */
function setPath(path,val){const p=path.split('.');let o=S;for(let i=0;i<p.length-1;i++){o=o[p[i]];if(o==null)return false}o[p[p.length-1]]=val;return true}
function onBind(ev){
  const t=ev.target;
  if(t.dataset.actChange){if(ev.type==='change')onActChange(t);return}
  if(t.dataset.p){if(ev.type==='change'&&t.value){S[t.dataset.p]=t.value;S.periodSet=true;S.mois='custom';rerender(true)}return}
  const path=t.dataset.b;if(!path||t.type==='file')return;
  const val=t.type==='checkbox'?t.checked:t.value,root=path.split('.')[0];
  setPath(path,val);
  if(t.dataset.reset)S[t.dataset.reset]=[];
  const P=path.split('.');
  if(path==='draft.piece')S.draft.autoPiece=false;
  if(path==='draft.journal'&&S.draft.autoPiece){S.draft.piece=nextPiece(S.draft.journal);const p=$('#f-piece');if(p)p.value=S.draft.piece}
  if(P[0]==='draft'&&P[1]==='lignes'){const i=P[2];if(P[3]==='c'){const l=$('#lab-'+i);if(l)l.textContent=accLabel(val.trim())}if(P[3]==='t'){const l=$('#labt-'+i);if(l)l.textContent=val?tiersNom(val):''}}
  if(path==='fv.date'&&S.fv.autoEch){S.fv.echeance=addDays(val,num(S.settings.delai)||0);const e=$('#fv-ech');if(e)e.value=S.fv.echeance}
  if(path==='fv.echeance')S.fv.autoEch=false;
  if(path==='guide.type'){const gd=GUIDES.find(x=>x.id===val);S.guide.compte=gd.kind==='produit'?'701':gd.kind==='charge'?'601':S.guide.compte}
  if(root==='draft')updateTotals();
  if(root==='fv')updateFactTotals();
  if(root==='paie'&&ev.type==='change')store.persist().catch(()=>{});
  if(t.dataset.live){
    rerender(true);const el=t.id&&$('#'+t.id);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}
  }else if(t.dataset.rr&&ev.type==='change')rerender(true);
}
async function onActChange(t){
  const a=t.dataset.actChange;
  if(a==='aff'){S.aff=t.value;rerender(true)}
  else if(a==='mois'){
    S.mois=t.value;S.periodSet=true;const Y=S.settings.exercice;
    if(t.value==='ex'){S.du=Y+'-01-01';S.au=Y+'-12-31'}
    else{const m=+t.value;S.du=Y+'-'+z2(m)+'-01';S.au=Y+'-'+z2(m)+'-'+z2(new Date(Y,m,0).getDate())}
    rerender(true);
  }else if(a==='exo'){
    const y=parseInt(t.value,10);if(!y)return;
    S.settings.exercice=y;S.periodSet=false;S.mois='ex';S.du=y+'-01-01';S.au=y+'-12-31';S.draft=newDraft();S.fv=null;
    await commit();
  }
}
function openDraftFrom(e){
  S.draft={id:e.id,date:e.date,journal:e.journal,piece:e.piece,autoPiece:false,libelle:e.libelle,devise:e.devise,lignes:e.lignes.map(l=>({c:String(l.c),t:l.t||'',lib:l.lib||'',d:num(l.d)?String(l.d):'',k:num(l.k)?String(l.k):''}))};
}
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-act]');
  if(!ev.target.closest('.dd')&&!(t&&t.dataset.act==='menu'))closeMenu();
  if(!t)return;
  const a=t.dataset.act,v=t.dataset.v,s=t.dataset.s,id=t.dataset.id;
  if(t.closest('.dd'))closeMenu();
  if(!canAct(a)){toast('Action non autorisée pour votre profil.');return}
  if(ACT[a]){await ACT[a](t,ev);return}
  if(a==='menu'){const open=t.getAttribute('aria-expanded')==='true';closeMenu();if(!open)openMenu(+t.dataset.i,t);return}
  if(a==='go')go(v,s);
  else if(a==='grp'){S.navOpen[t.dataset.g]=S.navOpen[t.dataset.g]===false;rerender(true)}
  else if(a==='new'){S.draft=newDraft();go('saisie')}
  else if(a==='save'){if(S.view==='saisie')saveDraft();else if(S.view==='facture')saveFacture();else toast('Vos données sont enregistrées automatiquement.')}
  else if(a==='json')exportFile('sauvegarde-'+(S.dossier.nom||'dossier').replace(/[^\w-]+/g,'_')+'.json',JSON.stringify(store.data()));
  else if(a==='restore')openRestore();
  else if(a==='quit')window.nia.quit();
  else if(a==='csv')exportView();
  else if(a==='refresh')rerender(true);
  else if(a==='start'){S.settings.started=true;await commit('Votre comptabilité est vide. Ajoutez votre première écriture.')}
  else if(a==='guide')applyGuide();
  else if(a==='addline'){S.draft.lignes.push({c:'',t:'',lib:'',d:'',k:''});rerender(true)}
  else if(a==='rmline'){S.draft.lignes.splice(+t.dataset.i,1);rerender(true)}
  else if(a==='resetdraft'){S.draft=newDraft();rerender(true)}
  else if(a==='edit'){const e=entryById(id);if(!e)return;if(locked(e.date)){toast('Exercice clôturé : modification impossible.');return}openDraftFrom(e);go('saisie')}
  else if(a==='askdel'){const e=entryById(id);if(e&&locked(e.date)){toast('Exercice clôturé : suppression impossible.');return}S.confirm=id;rerender(true)}
  else if(a==='nodel'){S.confirm=null;rerender(true)}
  else if(a==='del'){const e=entryById(id);if(e){for(const l of e.lignes)if(l.lt)unletter(l.lt);dropEntry(id)}S.confirm=null;await commit('Écriture supprimée.')}
  else if(a==='openfact'){const f=S.factures.find(x=>x.id===id);if(f){S.fv=JSON.parse(JSON.stringify(f));S.ft=f.type;S.view='facture';rerender(true);$('#app').scrollTop=0}}
  else if(a==='mcancel')closeModal();
  else if(a==='mok'){const fn=MOK[S.modal&&S.modal.kind];if(fn)await fn()}
  else if(a==='tnew')openTiers('',v);
  else if(a==='tedit')openTiers(id);
  else if(a==='tgl'){S.glT=id;go('etat','glaux')}
  else if(a==='tdel'){if(tiersUsed(id)){toast('Ce tiers est utilisé dans des écritures ou des factures : suppression impossible.');return}S.tiers=S.tiers.filter(x=>x.code!==id);await commit('Tiers supprimé.')}
  else if(a==='accnew')openModal({title:'Ajouter un compte',kind:'plan',ok:'Ajouter',body:fld('m-n','Numéro du compte','','inputmode="numeric"')+fld('m-l','Intitulé','')});
  else if(a==='accdel'){S.settings.extra=(S.settings.extra||[]).filter(x=>x.n!==id);await commit('Compte supprimé.')}
  else if(a==='plcls'){S.planCls=v;rerender(true)}
  else if(a==='jview'){S.jf=id;go('journal')}
  else if(a==='newfact'){S.ft=v;S.fv=newFacture(v);go('facture')}
  else if(a==='fvadd'){S.fv.lignes.push({lib:'',qte:'1',pu:'',compte:S.fv.type==='V'?'701':'601',tva:num(S.settings.tva)>0});rerender(true)}
  else if(a==='fvrm'){S.fv.lignes.splice(+t.dataset.i,1);rerender(true)}
  else if(a==='fvsave')saveFacture();
  else if(a==='fvprev'){S.view='apercu';rerender(true);$('#app').scrollTop=0}
  else if(a==='fvback'){S.view='facture';rerender(true)}
  else if(a==='fvask'){S.confirm='fv';rerender(true)}
  else if(a==='fvdel')delFacture();
  else if(a==='regnew')openReglement();
  else if(a==='regdel')delReglement(id);
  else if(a==='immonew')openImmo('');
  else if(a==='immoedit')openImmo(id);
  else if(a==='immodel'){if(S.entries.some(e=>e.src==='I:'+id||e.src==='S:'+id)){toast('Des écritures existent pour ce bien : suppression impossible.');return}S.immos=S.immos.filter(x=>x.id!==id);await commit('Immobilisation supprimée.')}
  else if(a==='immogen')genDotations();
  else if(a==='ltsel'){const k=t.dataset.k,A=S.ltsel||[],i=A.indexOf(k);if(i>=0)A.splice(i,1);else A.push(k);S.ltsel=A;rerender(true)}
  else if(a==='ltdo')doLettrage();
  else if(a==='ltundo')undoLettrage();
  else if(a==='rpsel')togglePoint(t.dataset.k);
  else if(a==='rep'){S.rep=v;rerender(true)}
  else if(a==='baset'){S.ba=v;rerender(true)}
  else if(a==='tvagen')genTVA();
  else if(a==='askclose'){S.confirm='close';rerender(true)}
  else if(a==='clot')doCloture();
  else if(a==='askreopen'){S.confirm='reopen';rerender(true)}
  else if(a==='rouvrir')doRouvrir();
  else if(a==='savesettings'){
    const st=S.settings,ex=parseInt($('#s-ex').value,10),tx=num($('#s-taux').value);
    st.nom=$('#s-nom').value.trim()||'Ma société';st.adresse=$('#s-adr').value.trim();st.tel=$('#s-tel').value.trim();st.email=$('#s-mail').value.trim();
    st.nif=$('#s-nif').value.trim();st.rccm=$('#s-rccm').value.trim();st.idnat=$('#s-idn').value.trim();st.banque=$('#s-banque').value.trim();
    if(ex>=2000&&ex<=2100&&ex!==st.exercice){st.exercice=ex;S.periodSet=false;S.mois='ex';S.du=ex+'-01-01';S.au=ex+'-12-31';S.draft=newDraft()}
    if(tx>0)st.taux=tx;
    st.tva=num($('#s-tva').value)>0?String(num($('#s-tva').value)):'';st.delai=Math.max(0,parseInt($('#s-delai').value,10)||0);
    const d=S.index.dossiers.find(x=>x.id===S.dossier.id);if(d){d.nom=st.nom;S.dossier.nom=st.nom;await store.saveIndex().catch(()=>{})}
    await commit('Réglages enregistrés.');
  }
  else if(a==='askwipe'){S.confirm='wipe';rerender(true)}
  else if(a==='wipe'){S.entries=[];S.tiers=[];S.factures=[];S.immos=[];S.settings.clotures={};S.settings.started=true;S.confirm=null;S.draft=newDraft();await commit('Toutes les données du dossier ont été effacées.')}
  else if(a==='dopen'){await openDossier(id);S.view='home';rerender(true);toast('Dossier ouvert.')}
  else if(a==='dnew')openModal({title:'Nouveau dossier',kind:'dossier',data:{id:''},ok:'Créer',body:fld('m-nom','Nom de la société','')});
  else if(a==='drename'){const d=S.index.dossiers.find(x=>x.id===id);openModal({title:'Renommer le dossier',kind:'dossier',data:{id},ok:'Renommer',body:fld('m-nom','Nom',d.nom)})}
  else if(a==='dremove'){S.index.dossiers=S.index.dossiers.filter(x=>x.id!==id);await store.saveIndex();rerender(true);toast('Dossier retiré de la liste.')}
});
document.addEventListener('input',onBind);
document.addEventListener('change',onBind);
document.addEventListener('keydown',ev=>{
  const k=ev.key.toLowerCase();
  if(ev.key==='Escape'){closeMenu();if(S.modal)closeModal();return}
  if(ev.key==='Enter'&&S.modal&&ev.target.tagName==='INPUT'&&ev.target.type!=='file'){ev.preventDefault();const fn=MOK[S.modal.kind];if(fn&&(canWrite()||S.modal.kind==='pwd'))fn();return}
  if(ev.ctrlKey&&k==='n'){ev.preventDefault();if(!canWrite()||!canView('saisie'))return;S.draft=newDraft();go('saisie')}
  else if(ev.ctrlKey&&k==='s'){ev.preventDefault();if(!canWrite()){toast('Lecture seule.');return}if(S.view==='saisie')saveDraft();else if(S.view==='facture')saveFacture()}
  else if(ev.key==='F1'){ev.preventDefault();go('aide')}
  else if(ev.key==='F5'){ev.preventDefault();rerender(true)}
});
$('#hamb').addEventListener('click',()=>$('#side').classList.toggle('open'));
S.draft=newDraft();
rerender(true);
initStore();
